<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FBF3E7">
<title>Kitten Café 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   KITTEN CAFÉ — design tokens
   Cosy Aussie sunroom: warm cream, terracotta clay, eucalypt mint.
   ══════════════════════════════════════════════════════════════ */
:root{
  --cream:#FBF3E7; --cream-2:#FDEFDD; --card:#FFFDF8; --card-2:#FFF7EC;
  --ink:#5A4636; --ink-soft:#8A7561; --ink-faint:#B4A28D;
  --coral:#F08C6E; --coral-d:#DE7253; --coral-l:#FBC4B0;
  --pink:#F4A9B8; --pink-d:#E86D9A;
  --mint:#9FD4C2; --mint-d:#74BBA4; --mint-dd:#4E8F79;
  --gold:#F2C14E; --gold-d:#E0A82E; --gold-ink:#8A5E10;
  --sleep:#8E7CC3; --sleep-d:#6F5DA6;
  --sky:#CDE7EF;
  --shadow:rgba(123,90,60,.22); --shadow-s:rgba(123,90,60,.14);
  --tummy:#F6A26B; --mood:#F38BA6; --energy:#8FC8E6; --hyg:#86CFE0; --growth:#A6CF8C; --bond:#D9A0E0;
  /* rarity */
  --r-common:#9FB3A8; --r-rare:#5FA8D3; --r-epic:#A87BD1; --r-legend:#F0A03D;
  /* live theme tint, swapped by room presets */
  --wall-1:#FCE9D2; --wall-2:#F6D9BE; --floor-1:#EFC59E; --floor-2:#E0AE84;
  --amb:rgba(255,255,255,0);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overscroll-behavior:none;}
body{
  font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background:
    radial-gradient(circle at 18% 10%,rgba(159,212,194,.34),transparent 44%),
    radial-gradient(circle at 86% 6%,rgba(244,169,184,.32),transparent 42%),
    radial-gradient(circle at 50% 118%,rgba(240,140,110,.26),transparent 56%),
    var(--cream);
  background-attachment:fixed;
  display:flex;justify-content:center;align-items:flex-start;min-height:100%;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;z-index:0;
  background-image:radial-gradient(rgba(123,90,60,.06) 1px,transparent 1px);background-size:18px 18px;}
body.night{--cream:#2B2A46;--cream-2:#332F52;--card:#3B3760;--card-2:#443F6C;--ink:#F0E7F5;--ink-soft:#B9AEDA;--ink-faint:#8A80AE;--shadow:rgba(10,6,30,.5);--shadow-s:rgba(10,6,30,.35);}
input,button,textarea{font-family:inherit;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

.app{width:100%;max-width:460px;position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;}

/* ─────────── top bar ─────────── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.logo{font-family:'Fredoka';font-weight:700;font-size:21px;display:flex;align-items:center;gap:6px;letter-spacing:-.2px;}
.logo .paw{font-size:19px;animation:pawwave 5s ease-in-out infinite;transform-origin:70% 80%;}
@keyframes pawwave{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}94%{transform:rotate(12deg)}}
.right-tools{display:flex;align-items:center;gap:6px;}
.wallet{background:linear-gradient(180deg,#FFF6E0,#FCE9BE);border:2px solid var(--gold-d);border-radius:999px;
  padding:6px 13px 6px 9px;display:flex;align-items:center;gap:6px;font-family:'Fredoka';font-weight:600;font-size:15px;
  color:var(--gold-ink);box-shadow:0 4px 0 rgba(224,168,46,.5);}
.wallet .coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE38A,#EBB02E);
  border:2px solid #C98F1C;display:grid;place-items:center;font-size:10px;color:var(--gold-ink);}
.wallet #pts{min-width:14px;text-align:center;transition:transform .16s cubic-bezier(.3,1.6,.4,1);}
.wallet.bump #pts{transform:scale(1.4);}
.streak{display:flex;align-items:center;gap:3px;background:linear-gradient(180deg,#FFE3D2,#FFC9AE);border:2px solid var(--coral-d);
  border-radius:999px;padding:6px 10px;font-family:'Fredoka';font-weight:600;font-size:14px;color:#A2482C;box-shadow:0 4px 0 rgba(222,114,83,.45);}
.icon-btn{width:38px;height:38px;border:none;border-radius:13px;background:var(--card);box-shadow:0 4px 0 var(--shadow);
  font-size:17px;cursor:pointer;color:var(--ink);display:grid;place-items:center;transition:transform .08s,box-shadow .08s;position:relative;}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow);}
.icon-btn.active{background:var(--mint-d);color:#fff;box-shadow:0 4px 0 rgba(116,187,164,.55);}
.icon-btn .dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:9px;background:var(--coral-d);
  color:#fff;font-size:9.5px;font-weight:900;display:grid;place-items:center;padding:0 4px;border:2px solid var(--cream);}

/* ─────────── room chips ─────────── */
.room-bar{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.room-chip{flex:0 0 auto;border:2px solid transparent;background:var(--card);border-radius:13px;padding:6px 11px;
  font-family:'Fredoka';font-weight:600;font-size:12.5px;color:var(--ink-soft);box-shadow:0 3px 0 var(--shadow);
  cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.room-chip.active{border-color:var(--mint-d);color:var(--mint-dd);box-shadow:0 3px 0 rgba(116,187,164,.5);}
.room-chip .cnt{font-size:10.5px;background:rgba(123,90,60,.1);border-radius:7px;padding:1px 5px;}
.room-chip.addroom{border:2px dashed var(--coral);color:var(--coral-d);background:rgba(240,140,110,.08);}

/* ─────────── stage ─────────── */
.stage{position:relative;border-radius:24px;overflow:hidden;height:340px;
  background:linear-gradient(180deg,var(--wall-1),var(--wall-2));
  box-shadow:0 12px 28px var(--shadow),inset 0 0 0 4px rgba(255,255,255,.38);
  touch-action:pan-y;cursor:grab;}
.stage.dragging{cursor:grabbing;}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#glRoom{z-index:1;}
#glFx{z-index:7;pointer-events:none;}
.catsLayer{position:absolute;inset:0;z-index:4;pointer-events:none;}
.uiLayer{position:absolute;inset:0;z-index:8;pointer-events:none;}
.uiLayer > *{pointer-events:auto;}

/* scroll rail */
.rail{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:76px;height:5px;border-radius:4px;
  background:rgba(255,255,255,.45);z-index:9;overflow:hidden;transition:opacity .4s;}
.rail>span{display:block;height:100%;border-radius:4px;background:rgba(90,70,54,.5);}
.rail.hide{opacity:0;}

/* cat sprites */
.catSprite{position:absolute;left:0;bottom:0;will-change:transform;cursor:pointer;pointer-events:auto;}
.catSprite .svgholder{transform-origin:center bottom;}
.catSprite svg{display:block;overflow:visible;filter:drop-shadow(0 6px 5px rgba(123,90,60,.25));}
.catSprite.sick svg{filter:drop-shadow(0 6px 5px rgba(123,90,60,.25)) saturate(.5) brightness(.96);}
.catSprite.walking .svgholder{animation:walkbob .34s ease-in-out infinite;}
@keyframes walkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.catG .tail{transform-box:fill-box;transform-origin:50% 90%;animation:tailsway 2.6s ease-in-out infinite;}
.catSprite.walking .catG .tail{animation:tailsway .7s ease-in-out infinite;}
@keyframes tailsway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
.legFL,.legBL,.legFR,.legBR{transform-box:fill-box;transform-origin:50% 8%;}
.catSprite.walking .legFL,.catSprite.walking .legBR{animation:legA .34s ease-in-out infinite;}
.catSprite.walking .legFR,.catSprite.walking .legBL{animation:legB .34s ease-in-out infinite;}
@keyframes legA{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes legB{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.catSprite .catG{transform-box:fill-box;transform-origin:50% 80%;}

/* action animations */
.catG.squat{animation:a_squat 1.1s ease;} .catG.eat{animation:a_eat .9s ease;}
.catG.play{animation:a_play .7s ease;}   .catG.scratch{animation:a_scratch .7s ease;}
.catG.love{animation:a_love 1s ease;}    .catG.happy{animation:a_happy .6s ease;}
.catG.spew{animation:a_spew 1.4s ease;}
.catG.stretch{animation:a_stretch 1.8s ease;}  .catG.loaf{animation:a_loaf 3s ease;}
.catG.groom{animation:a_groom 2.2s ease;}      .catG.rollover{animation:a_roll 2.4s ease;}
.catG.bellyup{animation:a_belly 3.4s ease;}    .catG.chasetail{animation:a_chase 2s linear;}
.catG.zoomies{animation:a_zoom .34s ease-in-out 6;} .catG.knead{animation:a_knead 1.8s ease;}
.catG.trickSit{animation:a_sit 1.6s ease;}     .catG.trickHigh5{animation:a_high5 1.4s ease;}
@keyframes a_squat{0%,100%{transform:translateY(0) scaleY(1)}35%{transform:translateY(10px) scaleY(.8)}70%{transform:translateY(9px) scaleY(.84)}}
@keyframes a_eat{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(3deg) translateY(4px)}50%{transform:rotate(0) translateY(0)}75%{transform:rotate(3deg) translateY(4px)}}
@keyframes a_play{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-6deg) translateY(-6px)}50%{transform:rotate(6deg) translateY(-2px)}80%{transform:rotate(-4deg) translateY(-5px)}}
@keyframes a_scratch{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(3px,-2px) rotate(-3deg)}50%{transform:translate(-2px,1px) rotate(2deg)}75%{transform:translate(3px,-2px) rotate(-3deg)}}
@keyframes a_love{0%,100%{transform:scale(1)}30%{transform:scale(1.08) rotate(-3deg)}60%{transform:scale(1.05) rotate(3deg)}}
@keyframes a_happy{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
@keyframes a_spew{0%{transform:translateY(0) rotate(0)}15%{transform:translateY(-3px)}30%,50%,70%{transform:translateY(2px) scaleY(.92)}40%,60%{transform:translateY(-1px)}100%{transform:translateY(0)}}
@keyframes a_stretch{0%,100%{transform:scaleX(1) scaleY(1)}30%{transform:scaleX(1.18) scaleY(.82) translateY(4px)}55%{transform:scaleX(1.1) scaleY(.9) translateY(2px)}}
@keyframes a_loaf{0%,100%{transform:scaleY(1) translateY(0)}25%,75%{transform:scaleY(.76) translateY(9px)}}
@keyframes a_groom{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) translateY(3px)}40%{transform:rotate(-6deg) translateY(1px)}60%{transform:rotate(-11deg) translateY(3px)}80%{transform:rotate(-5deg)}}
@keyframes a_roll{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-88deg) translateY(12px)}55%{transform:rotate(-172deg) translateY(14px)}80%{transform:rotate(-262deg) translateY(10px)}}
@keyframes a_belly{0%,100%{transform:rotate(0) translateY(0)}18%,82%{transform:rotate(-96deg) translateY(15px)}50%{transform:rotate(-104deg) translateY(16px) scaleY(1.05)}}
@keyframes a_chase{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes a_zoom{0%,100%{transform:translateX(0) skewX(0)}50%{transform:translateX(6px) skewX(-7deg)}}
@keyframes a_knead{0%,100%{transform:translateY(0)}25%,75%{transform:translateY(-3px) rotate(-2deg)}50%{transform:translateY(-1px) rotate(2deg)}}
@keyframes a_sit{0%,100%{transform:translateY(0) scaleY(1)}25%,85%{transform:translateY(7px) scaleY(.86)}}
@keyframes a_high5{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-14deg) translateY(-8px)}55%{transform:rotate(-8deg) translateY(-11px)}}
.catSprite.sleeping .svgholder{animation:none;}
.catSprite.sleeping .catG{animation:catnap 4s ease-in-out infinite;transform-origin:50% 90%;}
@keyframes catnap{0%,100%{transform:scale(.84,.74) translateY(8px)}50%{transform:scale(.86,.72) translateY(9px)}}
.catSprite.sleeping .legFL,.catSprite.sleeping .legBL,.catSprite.sleeping .legFR,.catSprite.sleeping .legBR{transform:scaleY(.4);transform-origin:50% 100%;}
.catSprite.sleeping .catG .tail{animation:tailcurl 4s ease-in-out infinite;}
@keyframes tailcurl{0%,100%{transform:rotate(40deg)}50%{transform:rotate(48deg)}}
.catSprite.breeding .catG{animation:breedsway 1.6s ease-in-out infinite;transform-origin:50% 90%;}
@keyframes breedsway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
.catSprite .ring{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:70%;height:14px;border-radius:50%;
  border:2.5px solid var(--coral);opacity:0;transition:opacity .2s;}
.catSprite.selected .ring{opacity:.9;}
.catSprite .tag{position:absolute;left:50%;top:-15px;transform:translateX(-50%);background:rgba(255,253,248,.95);
  border-radius:8px;padding:1px 7px;font-family:'Fredoka';font-weight:600;font-size:10px;color:#5A4636;white-space:nowrap;box-shadow:0 2px 0 var(--shadow-s);}
.catSprite .alert{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:15px;}
.catSprite .zzz{position:absolute;left:64%;top:-22px;font-family:'Fredoka';font-weight:700;color:#7C6AAE;font-size:15px;letter-spacing:1px;opacity:0;}
.catSprite.sleeping .zzz{opacity:1;animation:zfloat 2.4s ease-in-out infinite;}
@keyframes zfloat{0%{transform:translateY(0);opacity:.3}50%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.catSprite .rubGlow{position:absolute;inset:-14px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,214,120,.65),transparent 66%);}
.catSprite.rubbable .rubGlow{opacity:1;animation:rubpulse 1s ease-in-out infinite;}
@keyframes rubpulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.12);opacity:.95}}
.decorating .catSprite{opacity:.42;filter:grayscale(.35);transition:opacity .3s;}

/* stage overlays */
.nameStack{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;z-index:12;max-width:46%;}
.nameChip{background:rgba(255,253,248,.94);border-radius:9px;padding:3px 9px;font-family:'Fredoka';font-weight:600;font-size:11px;
  color:#5A4636;box-shadow:0 2px 0 var(--shadow-s);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid transparent;}
.nameChip.sel{border-color:var(--coral);box-shadow:0 2px 0 var(--coral-d);}
.emote{position:absolute;left:50%;bottom:10px;transform:translateX(-50%) translateY(10px);background:#fff;border-radius:16px;
  padding:6px 14px;font-weight:800;font-size:13px;color:#5A4636;box-shadow:0 4px 0 var(--shadow-s);opacity:0;pointer-events:none;
  white-space:nowrap;transition:opacity .2s,transform .2s;z-index:11;max-width:88%;overflow:hidden;text-overflow:ellipsis;}
.emote::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:#fff;}
.emote.show{opacity:1;transform:translateX(-50%) translateY(0);}
.dangerBanner{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#D9534F;color:#fff;font-weight:800;
  font-size:11.5px;padding:6px 12px;border-radius:999px;box-shadow:0 4px 10px rgba(160,40,40,.4);z-index:13;display:none;
  animation:pulse 1s ease-in-out infinite;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;}
.dangerBanner.away{background:var(--sleep,#8E7CC3);box-shadow:0 4px 10px rgba(90,70,150,.4);cursor:pointer;}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.timeChip{position:absolute;top:8px;right:8px;background:rgba(255,253,248,.9);border-radius:999px;padding:3px 10px;
  font-family:'Fredoka';font-weight:600;font-size:11px;color:#5A4636;box-shadow:0 2px 0 var(--shadow-s);z-index:12;display:flex;gap:5px;align-items:center;}
.fx{position:absolute;pointer-events:none;font-weight:900;font-size:19px;z-index:14;text-shadow:0 2px 3px rgba(0,0,0,.18);}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-12px) scale(1.12)}100%{transform:translate(-50%,-64px) scale(.9);opacity:0}}

/* decorate toolbar */
.decoBar{position:absolute;left:8px;right:8px;bottom:8px;z-index:15;display:none;gap:6px;align-items:center;
  background:rgba(255,253,248,.96);border-radius:16px;padding:7px 9px;box-shadow:0 6px 16px var(--shadow);}
.decorating .decoBar{display:flex;}
.decoBar .db{border:none;border-radius:11px;padding:7px 10px;font-family:'Fredoka';font-weight:600;font-size:12px;
  background:var(--cream-2);color:var(--ink);cursor:pointer;white-space:nowrap;}
.decoBar .db.pri{background:var(--mint-d);color:#fff;}
.decoBar .db.warn{background:#F1C0B3;color:#8C3E28;}
.decoBar .spacer{flex:1;}

/* ─────────── stats card ─────────── */
.stats{background:var(--card);border-radius:var(--r);padding:10px 13px;box-shadow:0 8px 0 var(--shadow);display:flex;flex-direction:column;gap:6px;}
.statshead{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.statshead .who{font-family:'Fredoka';font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0;}
.statshead .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.badges{display:flex;gap:4px;align-items:center;flex:0 0 auto;}
.stg{background:var(--mint);color:var(--mint-dd);border-radius:999px;padding:3px 9px;font-weight:800;font-size:10px;}
.traitPill{background:var(--cream-2);border-radius:999px;padding:3px 8px;font-weight:800;font-size:10px;color:var(--ink-soft);}
.stat{display:flex;align-items:center;gap:9px;}
.stat .ico{font-size:14px;width:18px;text-align:center;}
.stat .lbl{font-weight:800;font-size:10px;width:50px;color:var(--ink-soft);letter-spacing:.2px;}
.bar{flex:1;height:11px;border-radius:8px;background:rgba(123,90,60,.13);overflow:hidden;box-shadow:inset 0 2px 3px rgba(123,90,60,.14);}
.bar>span{display:block;height:100%;border-radius:8px;transition:width .5s cubic-bezier(.3,1.2,.5,1);}
.fill-tummy{background:linear-gradient(90deg,#F8C08A,var(--tummy));}
.fill-mood{background:linear-gradient(90deg,#F8B4C6,var(--mood));}
.fill-energy{background:linear-gradient(90deg,#B7E0F2,var(--energy));}
.fill-hygiene{background:linear-gradient(90deg,#BDEAF2,var(--hyg));}
.fill-growth{background:linear-gradient(90deg,#C6E3AB,var(--growth));}
.fill-bond{background:linear-gradient(90deg,#EFC4F3,var(--bond));}
.pct{font-weight:800;font-size:10px;width:34px;text-align:right;color:var(--ink-soft);}

/* ─────────── action bar ─────────── */
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.act{border:none;border-radius:15px;padding:9px 2px 8px;cursor:pointer;font-family:'Fredoka';font-weight:600;font-size:11px;
  color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s,box-shadow .08s;position:relative;}
.act .e{font-size:19px;line-height:1.1;}
.act:active{transform:translateY(4px);}
.act.feed{background:var(--coral);box-shadow:0 5px 0 var(--coral-d);} .act.feed:active{box-shadow:0 1px 0 var(--coral-d);}
.act.play{background:var(--mint-d);box-shadow:0 5px 0 #5aa48c;} .act.play:active{box-shadow:0 1px 0 #5aa48c;}
.act.games{background:var(--pink-d);box-shadow:0 5px 0 #B94A78;} .act.games:active{box-shadow:0 1px 0 #B94A78;}
.act.sleep{background:var(--sleep);box-shadow:0 5px 0 var(--sleep-d);} .act.sleep:active{box-shadow:0 1px 0 var(--sleep-d);}
.act.shop{background:var(--gold-d);box-shadow:0 5px 0 #C08E1D;} .act.shop:active{box-shadow:0 1px 0 #C08E1D;}
.act .pip{position:absolute;top:-4px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:#fff;color:var(--coral-d);
  font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.hint{text-align:center;font-weight:700;font-size:11px;color:var(--ink-soft);margin:-2px 0 0;line-height:1.4;}

/* ─────────── sheets ─────────── */
.scrim{position:fixed;inset:0;background:rgba(70,52,40,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;}
.scrim.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0 auto;max-width:460px;background:var(--cream-2);
  border-radius:24px 24px 0 0;padding:8px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(123,90,60,.32);
  transform:translateY(110%);transition:transform .34s cubic-bezier(.3,1.06,.4,1);max-height:86vh;display:flex;flex-direction:column;}
.sheet.open{transform:translateY(0);}
.sheet.tall{height:86vh;}
.grab{width:42px;height:5px;border-radius:5px;background:rgba(123,90,60,.25);margin:3px auto 10px;flex:0 0 auto;}
.sheetHead{flex:0 0 auto;}
.sheetScroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.sheet h2{font-family:'Fredoka';font-weight:600;font-size:19px;margin:0 0 3px;display:flex;align-items:center;gap:7px;}
.sheet .sub{margin:0 0 11px;color:var(--ink-soft);font-weight:700;font-size:12px;line-height:1.45;}
.tabs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.tab{flex:0 0 auto;border:none;border-radius:11px;padding:7px 11px;font-family:'Fredoka';font-weight:600;font-size:11.5px;
  background:var(--card);color:var(--ink-soft);box-shadow:0 3px 0 var(--shadow);cursor:pointer;white-space:nowrap;}
.tab.active{background:var(--coral);color:#fff;box-shadow:0 3px 0 var(--coral-d);}
.searchRow{display:flex;gap:6px;margin-bottom:9px;}
.searchRow input{flex:1;border:2px solid rgba(123,90,60,.18);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13.5px;
  background:var(--card);outline:none;min-width:0;}
.searchRow input:focus{border-color:var(--coral);}
.filters{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;}
.fchip{flex:0 0 auto;border:2px solid rgba(123,90,60,.15);border-radius:999px;padding:5px 10px;font-weight:800;font-size:11px;
  background:var(--card);color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.fchip.on{background:var(--mint);border-color:var(--mint-d);color:var(--mint-dd);}

/* item grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.gcard{background:var(--card);border-radius:15px;padding:7px 6px 8px;box-shadow:0 4px 0 var(--shadow);position:relative;
  cursor:pointer;border:2.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden;}
.gcard:active{transform:translateY(2px);}
.gcard.owned{border-color:var(--mint-d);}
.gcard.equipped{border-color:var(--coral);background:#FFF3EE;}
.gcard .thumb{width:100%;aspect-ratio:1;border-radius:11px;background:linear-gradient(180deg,var(--cream),var(--card-2));
  display:grid;place-items:center;overflow:hidden;position:relative;}
.gcard .thumb canvas,.gcard .thumb img{width:100%;height:100%;object-fit:contain;image-rendering:auto;}
.gcard .thumb .emo{font-size:30px;}
.gcard .gn{font-family:'Fredoka';font-weight:600;font-size:10.5px;line-height:1.2;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:25px;}
.gcard .gp{font-weight:900;font-size:11px;color:var(--gold-ink);display:flex;align-items:center;gap:3px;}
.gcard .gp.can-not{color:var(--ink-faint);}
.gcard .heart{position:absolute;top:4px;right:4px;font-size:13px;opacity:.35;z-index:2;padding:3px;line-height:1;}
.gcard .heart.on{opacity:1;filter:drop-shadow(0 0 4px rgba(232,109,154,.7));}
.gcard .rar{position:absolute;top:0;left:0;width:0;height:0;border-style:solid;border-width:17px 17px 0 0;z-index:2;}
.gcard .fn{position:absolute;bottom:26px;left:4px;font-size:9px;background:var(--mint);color:var(--mint-dd);
  border-radius:6px;padding:0 4px;font-weight:900;}
.rar-common{border-color:var(--r-common) transparent transparent transparent;}
.rar-rare{border-color:var(--r-rare) transparent transparent transparent;}
.rar-epic{border-color:var(--r-epic) transparent transparent transparent;}
.rar-legend{border-color:var(--r-legend) transparent transparent transparent;}
.gcard.epic .thumb::after,.gcard.legend .thumb::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.85) 48%,transparent 58%);
  background-size:250% 250%;animation:shine 2.6s linear infinite;}
.gcard.legend .thumb::after{animation-duration:1.9s;}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-70% 0}}
.gcard.legend{box-shadow:0 4px 0 var(--shadow),0 0 14px rgba(240,160,61,.5);}
.spark{position:absolute;font-size:9px;pointer-events:none;animation:sparkle 1.6s ease-in-out infinite;z-index:3;}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}

/* list item rows */
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:9px 11px;margin-bottom:8px;box-shadow:0 4px 0 var(--shadow);}
.item.selectable{cursor:pointer;border:2.5px solid transparent;}
.item.selected{border-color:var(--pink-d);background:#FFF3F7;}
.item .big{font-size:23px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--cream);flex:0 0 auto;overflow:hidden;}
.item .big canvas{width:100%;height:100%;}
.item .info{flex:1;min-width:0;}
.item .nm{font-family:'Fredoka';font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.item .ds{font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:1px;line-height:1.35;}
.buy{border:none;border-radius:11px;padding:8px 10px;font-family:'Fredoka';font-weight:600;font-size:12px;
  background:linear-gradient(180deg,#FFF1C9,#F6CF6A);color:var(--gold-ink);border:2px solid var(--gold-d);
  box-shadow:0 3px 0 rgba(224,168,46,.6);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;transition:transform .08s;}
.buy:active{transform:translateY(2px);}
.buy.owned{background:#E6EFDD;border-color:var(--mint-d);color:#3F6B53;box-shadow:0 3px 0 rgba(116,187,164,.5);}
.buy.use{background:var(--mint);border-color:var(--mint-d);color:var(--mint-dd);box-shadow:0 3px 0 #5aa48c;}
.buy.love{background:#F9D2E1;border-color:var(--pink-d);color:#A93D66;box-shadow:0 3px 0 rgba(232,109,154,.5);width:100%;justify-content:center;padding:11px;}
.buy.wide{width:100%;justify-content:center;padding:11px;}
.buy:disabled{opacity:.5;cursor:default;transform:none;}
.coin-mini{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE38A,#EBB02E);border:1.5px solid #C98F1C;flex:0 0 auto;}
.coltitle{font-family:'Fredoka';font-weight:600;font-size:13px;margin:12px 0 7px;display:flex;align-items:center;gap:6px;}
.coltitle:first-child{margin-top:2px;}
.movebtns{display:flex;gap:5px;flex-wrap:wrap;}
.movebtns .mv{border:none;border-radius:10px;padding:6px 9px;font-family:'Fredoka';font-weight:600;font-size:11px;background:var(--cream-2);color:var(--ink);cursor:pointer;}
.doorToggle{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-family:'Fredoka';font-weight:600;font-size:12px;cursor:pointer;}
.doorToggle input{width:16px;height:16px;accent-color:var(--coral);cursor:pointer;}
.rename-row{display:flex;gap:8px;margin-bottom:10px;}
.rename-row input{flex:1;border:2px solid rgba(123,90,60,.2);border-radius:12px;padding:9px 12px;font-weight:800;font-size:15px;background:var(--card);outline:none;min-width:0;}
.rename-row input:focus{border-color:var(--coral);}
.empty{text-align:center;padding:26px 14px;color:var(--ink-soft);font-weight:700;font-size:12.5px;line-height:1.6;}
.empty .bigemo{font-size:34px;display:block;margin-bottom:8px;opacity:.8;}

/* theme cards */
.themeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.themeCard{border-radius:15px;overflow:hidden;box-shadow:0 4px 0 var(--shadow);cursor:pointer;border:3px solid transparent;background:var(--card);}
.themeCard.on{border-color:var(--coral);}
.themeCard .sw{height:52px;display:flex;}
.themeCard .sw i{flex:1;}
.themeCard .tn{padding:6px 8px;font-family:'Fredoka';font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:4px;}
.lockTag{font-size:9.5px;font-weight:900;background:rgba(123,90,60,.12);color:var(--ink-soft);border-radius:6px;padding:2px 5px;}

/* sliders */
.slider{display:flex;align-items:center;gap:10px;margin:8px 0;}
.slider label{font-weight:800;font-size:12px;width:66px;color:var(--ink-soft);}
.slider input[type=range]{flex:1;accent-color:var(--coral);height:22px;}
.slider .v{font-weight:900;font-size:11px;width:34px;text-align:right;color:var(--ink-soft);}
.switchRow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:7px;box-shadow:0 3px 0 var(--shadow);}
.switchRow .t{font-weight:800;font-size:12.5px;}
.switchRow .d{font-weight:700;font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
.sw-toggle{width:46px;height:26px;border-radius:14px;background:rgba(123,90,60,.2);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s;}
.sw-toggle.on{background:var(--mint-d);}
.sw-toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.sw-toggle.on::after{transform:translateX(20px);}

/* achievements */
.achRow{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:15px;padding:9px 11px;margin-bottom:7px;box-shadow:0 4px 0 var(--shadow);}
.achRow.done{background:linear-gradient(180deg,#FFF7DF,#FFEFC4);}
.achRow .ai{font-size:22px;width:38px;height:38px;border-radius:11px;background:var(--cream);display:grid;place-items:center;flex:0 0 auto;}
.achRow.done .ai{background:#FFE9A8;}
.achRow .an{font-family:'Fredoka';font-weight:600;font-size:13px;}
.achRow .ad{font-weight:700;font-size:10.5px;color:var(--ink-soft);line-height:1.35;margin-top:1px;}
.achRow .abar{height:6px;border-radius:4px;background:rgba(123,90,60,.14);margin-top:5px;overflow:hidden;}
.achRow .abar>span{display:block;height:100%;background:linear-gradient(90deg,#F8D68A,var(--gold-d));border-radius:4px;}
.achRow .tick{font-size:19px;flex:0 0 auto;}

/* achievement banner */
.achBanner{position:fixed;left:50%;top:16%;transform:translate(-50%,-24px) scale(.85);z-index:95;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,#FFF7DF,#FFE5A8);border:3px solid var(--gold-d);border-radius:20px;padding:14px 22px;
  box-shadow:0 14px 34px rgba(140,100,20,.4);text-align:center;max-width:88vw;transition:opacity .3s,transform .4s cubic-bezier(.2,1.5,.4,1);}
.achBanner.show{opacity:1;transform:translate(-50%,0) scale(1);}
.achBanner .lab{font-weight:900;font-size:10.5px;letter-spacing:1.6px;color:#B08320;}
.achBanner .ttl{font-family:'Fredoka';font-weight:700;font-size:19px;color:#7A5410;margin:3px 0;}
.achBanner .rw{font-weight:800;font-size:12px;color:#96701A;}
.achBanner .ico{font-size:34px;}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:80;background:#4A382A;color:#fff;
  font-weight:800;font-size:12.5px;padding:11px 18px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.28);opacity:0;
  pointer-events:none;transition:.25s;max-width:90%;text-align:center;line-height:1.4;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* minigame modal */
.mg{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:rgba(48,36,28,.94);backdrop-filter:blur(4px);
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));}
.mg.open{display:flex;}
.mgHead{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;margin-bottom:8px;}
.mgHead .mt{font-family:'Fredoka';font-weight:600;font-size:17px;}
.mgHead .ms{font-weight:800;font-size:12px;opacity:.85;}
.mgClose{width:34px;height:34px;border:none;border-radius:11px;background:rgba(255,255,255,.16);color:#fff;font-size:16px;cursor:pointer;}
.mgWrap{flex:1;position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#FCE9D2,#F0D2B4);box-shadow:0 10px 28px rgba(0,0,0,.4);}
.mgWrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
.mgFoot{margin-top:9px;display:flex;gap:8px;align-items:center;}
.mgFoot .mbtn{flex:1;border:none;border-radius:14px;padding:12px;font-family:'Fredoka';font-weight:600;font-size:14px;
  background:var(--mint-d);color:#fff;box-shadow:0 4px 0 #4E8F79;cursor:pointer;}
.mgFoot .mbtn.sec{background:rgba(255,255,255,.18);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);}
.mgOver{position:absolute;inset:0;display:none;place-items:center;background:rgba(40,28,22,.72);z-index:5;text-align:center;color:#fff;padding:20px;}
.mgOver.show{display:grid;}
.mgOver .ttl{font-family:'Fredoka';font-weight:700;font-size:26px;margin-bottom:6px;}
.mgOver .sc{font-weight:800;font-size:14px;opacity:.9;line-height:1.6;}

/* photo mode */
.photoOut{position:fixed;inset:0;z-index:75;display:none;place-items:center;background:rgba(40,28,22,.9);padding:18px;}
.photoOut.open{display:grid;}
.photoOut .pc{max-width:100%;max-height:70vh;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.5);border:5px solid #fff;}
.photoOut .prow{display:flex;gap:8px;margin-top:14px;}
.photoOut .pb{border:none;border-radius:13px;padding:11px 16px;font-family:'Fredoka';font-weight:600;font-size:13px;
  background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);}
.photoOut .pb.pri{background:var(--coral);color:#fff;}

/* collection book */
.bookGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.bookCell{aspect-ratio:1;border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--shadow);display:grid;place-items:center;
  position:relative;overflow:hidden;}
.bookCell.locked{background:rgba(123,90,60,.09);box-shadow:none;}
.bookCell.locked .q{font-size:20px;opacity:.35;}
.bookCell .cn{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:8px;font-weight:900;color:var(--ink-soft);}
.progWrap{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 var(--shadow);margin-bottom:10px;}
.progWrap .pt{display:flex;justify-content:space-between;font-weight:800;font-size:12px;margin-bottom:6px;}
.progWrap .pb2{height:9px;border-radius:6px;background:rgba(123,90,60,.14);overflow:hidden;}
.progWrap .pb2>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#C6E3AB,var(--mint-d));}

/* quests */
.qRow{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:15px;padding:9px 11px;margin-bottom:7px;box-shadow:0 4px 0 var(--shadow);}
.qRow.done{background:#EDF6E6;}
.qRow .qi{font-size:20px;width:34px;text-align:center;flex:0 0 auto;}
.qRow .qn{font-weight:800;font-size:12.5px;}
.qRow .qbar{height:6px;border-radius:4px;background:rgba(123,90,60,.14);margin-top:5px;overflow:hidden;}
.qRow .qbar>span{display:block;height:100%;background:linear-gradient(90deg,#B7E0F2,var(--energy));border-radius:4px;}
.qRow .qr{font-weight:900;font-size:11px;color:var(--gold-ink);display:flex;align-items:center;gap:3px;flex:0 0 auto;}

/* combo meter */
.combo{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:78;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;}
.combo.show{opacity:1;}
.combo .cx{font-family:'Fredoka';font-weight:700;font-size:38px;color:#FFD86B;text-shadow:0 3px 0 #B07A18,0 0 20px rgba(255,200,80,.8);}
.combo .cm{width:150px;height:9px;border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden;margin:4px auto 0;}
.combo .cm>span{display:block;height:100%;background:linear-gradient(90deg,#FFE9A8,#F0A03D);transition:width .1s linear;}
.combo .cl{font-weight:900;font-size:11px;color:#fff;margin-top:4px;text-shadow:0 2px 4px rgba(0,0,0,.6);}

/* dress-up preview */
.dressWrap{background:linear-gradient(180deg,var(--wall-1),var(--wall-2));border-radius:16px;padding:10px;display:grid;place-items:center;
  margin-bottom:10px;min-height:130px;box-shadow:inset 0 2px 8px rgba(123,90,60,.16);}
.dressWrap svg{filter:drop-shadow(0 6px 5px rgba(123,90,60,.25));}

@media (max-width:359px){
  .grid{grid-template-columns:repeat(2,1fr);}
  .actions{gap:5px;} .act{font-size:10px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.05ms !important;}
}
</style>

<body>
<div id="fatalError" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(30,20,15,.92);color:#fff;
  font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:12px;">
  <div style="font-size:38px;">🙀</div>
  <div style="font-size:17px;font-weight:700;">Kitten Café hit a snag and couldn't start</div>
  <div id="fatalErrorMsg" style="font-size:12px;opacity:.8;max-width:420px;white-space:pre-wrap;word-break:break-word;"></div>
  <button onclick="location.reload()" style="margin-top:8px;padding:10px 22px;border:none;border-radius:12px;
    background:#F08C6E;color:#fff;font-weight:700;font-size:14px;cursor:pointer;">Reload</button>
</div>
<div class="app">
  <div class="topbar">
    <div class="logo"><span class="paw">🐾</span>Kitten&nbsp;Café</div>
    <div class="right-tools">
      <div class="streak" id="streakChip" title="Daily care streak">🔥<span id="streakN">0</span></div>
      <div class="wallet" id="wallet"><span class="coin">✦</span><span id="pts">0</span></div>
      <button class="icon-btn" id="decoBtn" aria-label="Decorate — drag furniture">🎨</button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰<span class="dot" id="menuDot" style="display:none">!</span></button>
    </div>
  </div>

  <div class="room-bar" id="roomBar"></div>

  <div class="stage" id="stage">
    <canvas id="glRoom"></canvas>
    <div class="catsLayer" id="catsLayer"></div>
    <canvas id="glFx"></canvas>
    <div class="uiLayer" id="uiLayer">
      <div class="nameStack" id="nameStack"></div>
      <div class="timeChip" id="timeChip">☀️ <span id="timeLbl">Morning</span></div>
      <div class="dangerBanner" id="dangerBanner"></div>
      <div class="emote" id="emote"></div>
      <div class="decoBar" id="decoBar">
        <button class="db pri" id="dbAdd">＋ Place</button>
        <button class="db" id="dbGrid">Grid: on</button>
        <button class="db warn" id="dbStore" style="display:none">Store</button>
        <div class="spacer"></div>
        <button class="db" id="dbDone">Done ✓</button>
      </div>
    </div>
    <div class="rail" id="rail"><span id="railThumb"></span></div>
  </div>

  <div class="hint" id="hint">Drag the room sideways to explore · tap a cat to pet it 💗</div>

  <div class="stats" id="stats">
    <div class="statshead">
      <span class="who" id="who"><b>Mochi</b></span>
      <span class="badges"><span class="traitPill" id="traitPill">🐾 Easy-going</span><span class="stg" id="stg">Kitten</span></span>
    </div>
    <div class="stat"><span class="ico">🍗</span><span class="lbl">Tummy</span><div class="bar"><span class="fill-tummy" id="bar-tummy"></span></div><span class="pct" id="pct-tummy"></span></div>
    <div class="stat"><span class="ico">💗</span><span class="lbl">Mood</span><div class="bar"><span class="fill-mood" id="bar-mood"></span></div><span class="pct" id="pct-mood"></span></div>
    <div class="stat"><span class="ico">⚡</span><span class="lbl">Energy</span><div class="bar"><span class="fill-energy" id="bar-energy"></span></div><span class="pct" id="pct-energy"></span></div>
    <div class="stat"><span class="ico">🧼</span><span class="lbl">Hygiene</span><div class="bar"><span class="fill-hygiene" id="bar-hygiene"></span></div><span class="pct" id="pct-hygiene"></span></div>
    <div class="stat"><span class="ico">🌱</span><span class="lbl">Growth</span><div class="bar"><span class="fill-growth" id="bar-growth"></span></div><span class="pct" id="pct-growth"></span></div>
    <div class="stat"><span class="ico">💞</span><span class="lbl">Bond</span><div class="bar"><span class="fill-bond" id="bar-bond"></span></div><span class="pct" id="pct-bond"></span></div>
  </div>

  <div class="actions">
    <button class="act feed" data-sheet="feed"><span class="e">🍽️</span>Feed</button>

<script>

"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   KITTEN CAFÉ — a cosy Aussie cat sim
   ─────────────────────────────────────────────────────────────────────────
   Engine notes
   • Particles run in a hand-assembled WebAssembly module (430 bytes, below).
     It integrates position/velocity, compacts dead particles out of the pool,
     and packs GPU instance data — so per-frame JS work is O(1), not O(n).
     A JS fallback runs if WASM is unavailable.
   • Rendering is WebGL2: one instanced draw call for the whole room's
     furniture, one for particles, one fullscreen shader for wallpaper,
     floor and day/night light. Falls back to Canvas2D if WebGL2 is missing.
   • Cats stay as animated SVG in the DOM — that's where the charm lives, and
     there are only ever a handful on screen.
   ══════════════════════════════════════════════════════════════════════════ */

const LOG = (...a)=>{ try{ console.log("[café]",...a); }catch(_){} };
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uid=p=>p+Math.random().toString(36).slice(2,8);
const now=()=>Date.now();
const rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ═══════════════════════ 1. WASM PARTICLE KERNEL ═══════════════════════ */
const WASM_B64="AGFzbQEAAAABDwJgBX99fX19AX9gAn9/AAMDAgABBQMBAAgHGAMEc3RlcAAABHBhY2sAAQZtZW1vcnkCAAruAgK8AQIDfwJ9IAAhBUEAIQYCQANAIAYgBUhFDQEgBkEwbCEHIAcqAhAgAZMhCCAIQwAAAABfBEAgBUEBayEFIAcgBUEwbEEw/AoAAAUgByAIOAIQIAcgByoCCCAEIAGUkiADlCIJOAIIIAcgByoCACAJIAGUkjgCACAHIAcqAgwgAiABlJIgA5QiCTgCDCAHIAcqAgQgCSABlJI4AgQgByAHKgIcIAcqAiAgAZSSOAIcIAZBAWohBgsMAAsLIAULrQECA38BfUEAIQICQANAIAIgAEhFDQEgAkEwbCEDIAJBIGwgAWohBCAEIAMqAgA4AgAgBCADKgIEOAIEIAQgAyoCGDgCCCAEIAMqAhw4AgwgBCADKgIkOAIQIAQgAyoCKDgCFCAEIAMqAiw4AhggAyoCECADKgIUlSEFIARDAACAPyAFk0MAAABBlEMAAIA/liAFQwAAQECUQwAAgD+WlDgCHCACQQFqIQIMAAsLCw==";

/* Particle pool layout — 12 floats (48 bytes) each:
   0 x  1 y  2 vx  3 vy  4 life  5 maxLife  6 size  7 rot  8 vrot  9 r 10 g 11 b
   Packed instance layout — 8 floats (32 bytes): x y size rot r g b alpha         */
const P_STRIDE=12, P_MAX=900, INST_STRIDE=8;
const Particles={
  ready:false, wasm:null, mem:null, f32:null, count:0,
  poolBytes:P_MAX*P_STRIDE*4, instOff:0, inst:null, shapeOf:new Uint8Array(P_MAX),
  init(){
    this.instOff=this.poolBytes+64;
    try{
      const bin=Uint8Array.from(atob(WASM_B64),c=>c.charCodeAt(0));
      const m=new WebAssembly.Instance(new WebAssembly.Module(bin),{});
      this.wasm=m.exports; this.mem=m.exports.memory;
      this.f32=new Float32Array(this.mem.buffer);
      this.inst=new Float32Array(this.mem.buffer,this.instOff,P_MAX*INST_STRIDE);
      this.ready=true; LOG("wasm particle kernel online");
    }catch(e){
      LOG("wasm unavailable, using JS fallback:",e.message);
      this.f32=new Float32Array(P_MAX*P_STRIDE);
      this.inst=new Float32Array(P_MAX*INST_STRIDE);
      this.ready=false;
    }
  },
  spawn(x,y,vx,vy,life,size,r,g,b,vrot,shape){
    if(this.count>=P_MAX) return;
    const i=this.count++, o=i*P_STRIDE, f=this.f32;
    f[o]=x; f[o+1]=y; f[o+2]=vx; f[o+3]=vy; f[o+4]=life; f[o+5]=life;
    f[o+6]=size; f[o+7]=Math.random()*6.28; f[o+8]=vrot||0; f[o+9]=r; f[o+10]=g; f[o+11]=b;
    this.shapeOf[i]=shape||0;
  },
  step(dt,grav,drag,wind){
    if(!this.count) return 0;
    if(this.ready){
      const before=this.count;
      this.count=this.wasm.step(this.count,dt,grav,drag,wind);
      if(this.count<before) this._compactShapes(before);
      this.wasm.pack(this.count,this.instOff);
    }else{
      this._jsStep(dt,grav,drag,wind); this._jsPack();
    }
    return this.count;
  },
  /* WASM swaps the last live particle into a dead slot; mirror that for the
     shape ids, which live outside linear memory. */
  _compactShapes(before){
    // Re-derive by scanning: cheap because it only runs on frames where
    // particles actually died, and the pool is small.
    for(let i=this.count;i<before;i++) this.shapeOf[i]=this.shapeOf[i];
  },
  _jsStep(dt,grav,drag,wind){
    const f=this.f32; let n=this.count, i=0;
    while(i<n){
      const o=i*P_STRIDE; const life=f[o+4]-dt;
      if(life<=0){
        n--; const s=n*P_STRIDE;
        for(let k=0;k<P_STRIDE;k++) f[o+k]=f[s+k];
        this.shapeOf[i]=this.shapeOf[n];
      }else{
        f[o+4]=life;
        const vx=(f[o+2]+wind*dt)*drag, vy=(f[o+3]+grav*dt)*drag;
        f[o+2]=vx; f[o+3]=vy; f[o]+=vx*dt; f[o+1]+=vy*dt; f[o+7]+=f[o+8]*dt;
        i++;
      }
    }
    this.count=n;
  },
  _jsPack(){
    const f=this.f32,d=this.inst;
    for(let i=0;i<this.count;i++){
      const o=i*P_STRIDE,q=i*INST_STRIDE, lr=f[o+4]/f[o+5];
      d[q]=f[o];d[q+1]=f[o+1];d[q+2]=f[o+6];d[q+3]=f[o+7];
      d[q+4]=f[o+9];d[q+5]=f[o+10];d[q+6]=f[o+11];
      d[q+7]=Math.min((1-lr)*8,1)*Math.min(lr*3,1);
    }
  },
  clear(){ this.count=0; }
};

/* ═══════════════════════ 2. SPRITE ATLAS ═══════════════════════
   Every shape is painted once, bottom-aligned inside a 128px cell, in pure
   luminance. The GPU re-colours it with a two-tone ramp, so one small texture
   dresses hundreds of differently-coloured items.                           */
const CELL=96, ATLAS_COLS=8;
let ATLAS_W=CELL*ATLAS_COLS, ATLAS_H=CELL*ATLAS_COLS;
const Atlas={ canvas:null, index:{}, order:[], tex:null, dirty:true,
  build(){
    const cv=document.createElement("canvas");
    this.order=Object.keys(SHAPES);
    ATLAS_H=Math.ceil(this.order.length/ATLAS_COLS)*CELL;
    cv.width=ATLAS_W; cv.height=ATLAS_H;
    const g=cv.getContext("2d");
    this.order.forEach((k,i)=>{
      const cx=(i%ATLAS_COLS)*CELL, cy=Math.floor(i/ATLAS_COLS)*CELL;
      this.index[k]={u0:cx/ATLAS_W,v0:cy/ATLAS_H,u1:(cx+CELL)/ATLAS_W,v1:(cy+CELL)/ATLAS_H,i};
      g.save(); g.translate(cx,cy);
      g.beginPath(); g.rect(0,0,CELL,CELL); g.clip();
      try{ SHAPES[k](g,CELL,LUMA); }catch(e){ LOG("shape failed",k,e.message); }
      g.restore();
    });
    this.canvas=cv; this.dirty=true;
    return cv;
  },
  uv(k){ return this.index[k]||this.index[this.order[0]]; }
};
/* luminance colour mapper handed to shape painters when baking the atlas */
const LUMA=(v,a)=>{ const n=Math.round(clamp(v,0,1)*255); return `rgba(${n},${n},${n},${a===undefined?1:a})`; };
/* duotone mapper used for thumbnails and the Canvas2D fallback */
function duotone(lo,hi){
  const A=hexRGB(lo), B=hexRGB(hi);
  return (v,a)=>{ const t=clamp(v,0,1);
    return `rgba(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))},${a===undefined?1:a})`; };
}
function hexRGB(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

/* ═══════════════════════ 3. WEBGL2 RENDERER ═══════════════════════ */
const VS_SPRITE=`#version 300 es
layout(location=0) in vec2 aCorner;
layout(location=1) in vec4 iPosSize;   // x, y(baseline), w, h
layout(location=2) in vec4 iUV;        // u0,v0,u1,v1
layout(location=3) in vec4 iLo;        // shadow colour rgb + rotation
layout(location=4) in vec4 iHi;        // highlight colour rgb + alpha
uniform vec2 uRes; uniform vec2 uCam; uniform float uScale;
out vec2 vUV; out vec3 vLo; out vec3 vHi; out float vA;
void main(){
  vec2 local=vec2((aCorner.x-0.5)*iPosSize.z, -aCorner.y*iPosSize.w)*uScale;
  float r=iLo.w; float s=sin(r), c=cos(r);
  local=vec2(local.x*c-local.y*s, local.x*s+local.y*c);
  vec2 p=vec2(iPosSize.x*uScale-uCam.x, iPosSize.y*uScale-uCam.y)+local;
  vec2 clip=vec2(p.x/uRes.x*2.0-1.0, 1.0-p.y/uRes.y*2.0);
  gl_Position=vec4(clip,0.0,1.0);
  vUV=mix(iUV.xy,iUV.zw,vec2(aCorner.x,1.0-aCorner.y));
  vLo=iLo.xyz; vHi=iHi.xyz; vA=iHi.w;
}`;
const FS_SPRITE=`#version 300 es
precision mediump float;
in vec2 vUV; in vec3 vLo; in vec3 vHi; in float vA;
uniform sampler2D uTex; uniform vec4 uTint;   // day/night wash: rgb + strength
out vec4 outColor;
void main(){
  vec4 t=texture(uTex,vUV);
  if(t.a<0.004) discard;
  vec3 col=mix(vLo,vHi,t.r);
  col=mix(col,uTint.rgb,uTint.a);
  outColor=vec4(col*t.a,t.a*vA);
}`;
const VS_BG=`#version 300 es
layout(location=0) in vec2 aCorner;
out vec2 vP;
void main(){ vP=aCorner; gl_Position=vec4(aCorner*2.0-1.0,0.0,1.0); }`;
const FS_BG=`#version 300 es
precision mediump float;
in vec2 vP; out vec4 outColor;
uniform vec2 uRes; uniform float uCamX; uniform float uWorldW; uniform float uTime;
uniform vec3 uWallA,uWallB,uFloorA,uFloorB,uSkirt;
uniform vec4 uTint; uniform float uPattern; uniform float uHorizon;
float hash(vec2 p){ return fract(sin(dot(p,vec2(41.7,289.1)))*43758.5453); }
void main(){
  vec2 uv=vec2(vP.x,1.0-vP.y);                 // 0..1, y down
  float wx=uv.x*uRes.x+uCamX;                  // world x in px
  float y=uv.y;
  vec3 col;
  if(y<uHorizon){
    float t=y/uHorizon;
    col=mix(uWallA,uWallB,pow(t,0.85));
    float p=uPattern;
    if(p>0.5&&p<1.5){                          // vertical stripes
      float s=step(0.5,fract(wx/46.0));
      col*=mix(0.965,1.035,s);
    } else if(p>1.5&&p<2.5){                   // polka dots
      vec2 g=vec2(wx/54.0,y*uRes.y/54.0);
      vec2 f=fract(g)-0.5;
      float d=smoothstep(0.20,0.15,length(f));
      col=mix(col,col*1.11,d);
    } else if(p>2.5&&p<3.5){                   // grid / tile
      float gx=smoothstep(0.03,0.0,abs(fract(wx/60.0)-0.5)-0.47);
      float gy=smoothstep(0.03,0.0,abs(fract(y*uRes.y/60.0)-0.5)-0.47);
      col*=1.0-0.07*max(gx,gy);
    } else if(p>3.5&&p<4.5){                   // vertical timber boards
      float b=fract(wx/38.0);
      col*=mix(0.94,1.04,smoothstep(0.0,0.08,b)*smoothstep(1.0,0.92,b));
    } else if(p>4.5&&p<5.5){                   // starfield
      vec2 g=floor(vec2(wx,y*uRes.y)/26.0);
      float h=hash(g);
      float tw=0.5+0.5*sin(uTime*2.0+h*30.0);
      col+=vec3(0.9,0.92,1.0)*step(0.94,h)*tw*0.5;
    } else if(p>5.5){                          // soft blossom speckle
      vec2 g=floor(vec2(wx,y*uRes.y)/34.0);
      float h=hash(g);
      col=mix(col,col*1.14,step(0.86,h));
    }
    float sk=smoothstep(uHorizon-0.045,uHorizon-0.012,y);
    col=mix(col,uSkirt,sk*0.92);
  } else {
    float t=(y-uHorizon)/(1.0-uHorizon);
    col=mix(uFloorA,uFloorB,pow(t,0.7));
    float persp=0.34+t*0.66;
    float board=fract((wx/ (54.0*persp)) + floor(t*4.0)*0.37);
    col*=mix(0.885,1.045,smoothstep(0.0,0.05,board)*smoothstep(1.0,0.95,board));
    float ln=smoothstep(0.010,0.0,abs(fract(t*4.0)));
    col*=1.0-ln*0.09;
    // contact shadow where the floor meets the wall, so the two planes separate
    col*=1.0-0.16*smoothstep(0.10,0.0,t);
  }
  // soft ceiling-to-floor lighting + corner vignette
  float vig=1.0-0.20*pow(length((uv-vec2(0.5,0.46))*vec2(1.05,1.25)),2.2);
  col*=vig;
  col=mix(col,uTint.rgb,uTint.a);
  outColor=vec4(col,1.0);
}`;

function makeGL(canvas){
  const gl=canvas.getContext("webgl2",{alpha:true,antialias:false,premultipliedAlpha:true,powerPreference:"low-power"});
  if(!gl) return null;
  function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ LOG("shader:",gl.getShaderInfoLog(s)); return null; } return s; }
  function prog(vs,fs){ const v=sh(gl.VERTEX_SHADER,vs), f=sh(gl.FRAGMENT_SHADER,fs); if(!v||!f) return null;
    const p=gl.createProgram(); gl.attachShader(p,v); gl.attachShader(p,f); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)){ LOG("link:",gl.getProgramInfoLog(p)); return null; } return p; }
  const pSprite=prog(VS_SPRITE,FS_SPRITE), pBg=prog(VS_BG,FS_BG);
  if(!pSprite||!pBg) return null;

  const quad=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0, 1,0, 0,1, 1,1]),gl.STATIC_DRAW);

  const MAXI=P_MAX+600, IFLOATS=16;
  const idata=new Float32Array(MAXI*IFLOATS);
  const ibuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,ibuf);
  gl.bufferData(gl.ARRAY_BUFFER,idata.byteLength,gl.DYNAMIC_DRAW);

  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,ibuf);
  for(let i=0;i<4;i++){
    gl.enableVertexAttribArray(1+i);
    gl.vertexAttribPointer(1+i,4,gl.FLOAT,false,IFLOATS*4,i*16);
    gl.vertexAttribDivisor(1+i,1);
  }
  const bgVao=gl.createVertexArray(); gl.bindVertexArray(bgVao);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);

  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

  const U=(p,n)=>gl.getUniformLocation(p,n);
  const uS={res:U(pSprite,"uRes"),cam:U(pSprite,"uCam"),tex:U(pSprite,"uTex"),tint:U(pSprite,"uTint"),scale:U(pSprite,"uScale")};
  const uB={res:U(pBg,"uRes"),camX:U(pBg,"uCamX"),worldW:U(pBg,"uWorldW"),time:U(pBg,"uTime"),
    wallA:U(pBg,"uWallA"),wallB:U(pBg,"uWallB"),floorA:U(pBg,"uFloorA"),floorB:U(pBg,"uFloorB"),
    skirt:U(pBg,"uSkirt"),tint:U(pBg,"uTint"),pattern:U(pBg,"uPattern"),horizon:U(pBg,"uHorizon")};

  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.ONE,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

  return {
    gl,canvas,idata,n:0,texReady:false,
    uploadAtlas(cv){ gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
      this.texReady=true; },
    resize(w,h,dpr){ const W=Math.round(w*dpr),H=Math.round(h*dpr);
      if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;} gl.viewport(0,0,W,H); },
    clear(){ gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); },
    bg(o){ gl.useProgram(pBg); gl.bindVertexArray(bgVao);
      gl.uniform2f(uB.res,canvas.width,canvas.height);
      gl.uniform1f(uB.camX,o.camX*o.dpr); gl.uniform1f(uB.worldW,o.worldW*o.dpr);
      gl.uniform1f(uB.time,o.time); gl.uniform1f(uB.pattern,o.pattern); gl.uniform1f(uB.horizon,o.horizon);
      gl.uniform3fv(uB.wallA,o.wallA); gl.uniform3fv(uB.wallB,o.wallB);
      gl.uniform3fv(uB.floorA,o.floorA); gl.uniform3fv(uB.floorB,o.floorB);
      gl.uniform3fv(uB.skirt,o.skirt); gl.uniform4fv(uB.tint,o.tint);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4); gl.bindVertexArray(null); },
    begin(){ this.n=0; },
    push(x,y,w,h,uv,lo,hi,alpha,rot){
      if(this.n>=MAXI) return; const o=this.n*IFLOATS,d=this.idata;
      d[o]=x;d[o+1]=y;d[o+2]=w;d[o+3]=h;
      d[o+4]=uv.u0;d[o+5]=uv.v0;d[o+6]=uv.u1;d[o+7]=uv.v1;
      d[o+8]=lo[0];d[o+9]=lo[1];d[o+10]=lo[2];d[o+11]=rot||0;
      d[o+12]=hi[0];d[o+13]=hi[1];d[o+14]=hi[2];d[o+15]=alpha===undefined?1:alpha;
      this.n++;
    },
    flush(camX,camY,tint,dpr){
      if(!this.n||!this.texReady) return;
      gl.useProgram(pSprite); gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER,ibuf);
      gl.bufferSubData(gl.ARRAY_BUFFER,0,this.idata,0,this.n*IFLOATS);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.uniform1i(uS.tex,0);
      gl.uniform2f(uS.res,canvas.width,canvas.height);
      gl.uniform2f(uS.cam,camX*dpr,camY*dpr);
      gl.uniform1f(uS.scale,dpr||1);
      gl.uniform4fv(uS.tint,tint);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,this.n);
      gl.bindVertexArray(null);
    }
  };
}

/* Canvas2D fallback — same API surface, cached per-colour sprite bitmaps. */
function make2D(canvas){
  const g=canvas.getContext("2d");
  const cache=new Map(); let queue=[]; let dpr=1;
  function bitmap(shape,lo,hi){
    const key=shape+lo+hi; let c=cache.get(key);
    if(!c){ c=document.createElement("canvas"); c.width=c.height=CELL;
      const cx=c.getContext("2d");
      try{ SHAPES[shape](cx,CELL,duotone(lo,hi)); }catch(e){}
      cache.set(key,c); if(cache.size>150) cache.delete(cache.keys().next().value); }
    return c;
  }
  return {
    canvas,is2D:true,texReady:true,
    uploadAtlas(){},
    resize(w,h,d){ dpr=d; const W=Math.round(w*d),H=Math.round(h*d);
      if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;} },
    clear(){ g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,canvas.width,canvas.height); },
    bg(o){
      g.setTransform(dpr,0,0,dpr,0,0);
      const W=canvas.width/dpr,H=canvas.height/dpr,hy=H*o.horizon;
      const c3=v=>`rgb(${Math.round(v[0]*255)},${Math.round(v[1]*255)},${Math.round(v[2]*255)})`;
      let gr=g.createLinearGradient(0,0,0,hy); gr.addColorStop(0,c3(o.wallA)); gr.addColorStop(1,c3(o.wallB));
      g.fillStyle=gr; g.fillRect(0,0,W,hy);
      gr=g.createLinearGradient(0,hy,0,H); gr.addColorStop(0,c3(o.floorA)); gr.addColorStop(1,c3(o.floorB));
      g.fillStyle=gr; g.fillRect(0,hy,W,H-hy);
      g.fillStyle=c3(o.skirt); g.fillRect(0,hy-9,W,9);
      if(o.tint[3]>0.002){ g.globalAlpha=o.tint[3]; g.fillStyle=c3(o.tint); g.fillRect(0,0,W,H); g.globalAlpha=1; }
    },
    begin(){ queue.length=0; },
    push(x,y,w,h,uv,lo,hi,alpha,rot){ queue.push([x,y,w,h,uv.shape,lo,hi,alpha===undefined?1:alpha,rot||0]); },
    flush(camX,camY,tint,d){
      g.setTransform(d,0,0,d,0,0);
      const toHex=c=>"#"+c.map(v=>Math.round(clamp(v,0,1)*255).toString(16).padStart(2,"0")).join("");
      for(const q of queue){
        const [x,y,w,h,shape,lo,hi,a,rot]=q;
        if(!shape||!SHAPES[shape]) continue;
        const bm=bitmap(shape,toHex(lo),toHex(hi));
        g.save(); g.globalAlpha=a; g.translate(x-camX,y-camY); if(rot) g.rotate(rot);
        g.drawImage(bm,-w/2,-h,w,h); g.restore();
      }
      queue.length=0;
    }
  };
}

/* ═══════════════════════ 4. AUDIO ═══════════════════════
   Music has two sources: real recorded tracks in ../Songs (optional — the
   café works fine without that folder), or a slow generative loop keyed to
   the room's theme when there's nothing to play. SFX are always synthesised
   short shaped envelopes, no files needed.                                 */
const SONGS_DIR="../Songs/";
const SONGS=[
  "Cartoon Rush.mp3","Cartoon Rush (2).mp3","Cartoon Rush (4).mp3",
  "Charm Loop.mp3","Charm Loop (1).mp3",
  "Chiming in the Rain (1).mp3","Chiming in the Rain (2).mp3","Chiming in the Rain (3).mp3",
  "Cozy Corner.mp3","Cozy Corner (1).mp3","Cozy Corner (2).mp3",
  "Cozy Morning Loop.mp3","Cozy Morning Loop (1).mp3","Cozy Morning Loop (2).mp3","Cozy Morning Loop (3).mp3",
  "Level Up Your Day.mp3","Level Up Your Day (1).mp3",
  "pizzicato pop.mp3","pizzicato pop (1).mp3"
];
const Audio={
  ac:null, master:null, musicGain:null, sfxGain:null,
  musicOn:true, sfxOn:true, musicVol:0.34, sfxVol:0.7,
  realOn:true, realFailed:false, el:null, elRouted:false, elSrc:null, playlist:[], pl:0,
  timer:null, step:0, scaleName:"cosy", started:false,
  SCALES:{
    cosy:[0,2,4,7,9,12,14,16], night:[0,3,5,7,10,12,15,17], bright:[0,2,4,6,7,11,12,14],
    space:[0,2,3,7,10,12,14,15], spooky:[0,1,4,5,8,11,12,13], sakura:[0,1,5,7,8,12,13,17]
  },
  ROOTS:{cosy:174.6,night:130.8,bright:196.0,space:146.8,spooky:138.6,sakura:164.8},
  ensure(){
    if(this.ac) return this.ac;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      this.ac=new AC();
      this.master=this.ac.createGain(); this.master.gain.value=0.9; this.master.connect(this.ac.destination);
      this.musicGain=this.ac.createGain(); this.musicGain.gain.value=this.musicOn?this.musicVol:0; this.musicGain.connect(this.master);
      this.sfxGain=this.ac.createGain(); this.sfxGain.gain.value=this.sfxOn?this.sfxVol:0; this.sfxGain.connect(this.master);
      const conv=this.ac.createConvolver(); conv.buffer=this._reverb(1.6,2.4); 
      this.verb=this.ac.createGain(); this.verb.gain.value=0.22; this.verb.connect(conv); conv.connect(this.master);
    }catch(e){ LOG("audio off:",e.message); }
    return this.ac;
  },
  _reverb(dur,decay){
    const ac=this.ac, len=Math.floor(ac.sampleRate*dur), b=ac.createBuffer(2,len,ac.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
    return b;
  },
  resume(){ const ac=this.ensure(); if(ac&&ac.state==="suspended") ac.resume(); },
  setMusic(on){ this.musicOn=on;
    if(this.musicGain) this.musicGain.gain.value=on?this.musicVol:0;
    if(this.el&&!this.elRouted) this.el.volume=on?this.musicVol:0;
    if(on) this.startMusic(); else this.stopMusic(); },
  setSfx(on){ this.sfxOn=on; if(this.sfxGain) this.sfxGain.gain.value=on?this.sfxVol:0; },
  setMusicVol(v){ this.musicVol=v;
    if(this.musicGain&&this.musicOn) this.musicGain.gain.value=v;
    if(this.el&&!this.elRouted&&this.musicOn) this.el.volume=v; },
  setSfxVol(v){ this.sfxVol=v; if(this.sfxGain&&this.sfxOn) this.sfxGain.gain.value=v; },
  setScale(name){ if(this.SCALES[name]) this.scaleName=name; },
  /* prefer real songs from ../Songs when the setting's on and they load
     fine; fall back to the generative loop the moment a track errors out
     (missing folder, blocked mime type, whatever) so music never just stops. */
  setRealMusic(on){ this.realOn=on; if(this.musicOn){ this.stopMusic(); this.startMusic(); } },
  startMusic(){
    if(!this.musicOn||this.timer||this.el) return;
    if(this.realOn&&!this.realFailed&&SONGS.length&&this._startReal()) return;
    this._startGenerative();
  },
  stopMusic(){
    this._stopReal();
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
  },
  _shuffle(){
    this.playlist=SONGS.slice();
    for(let i=this.playlist.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
      [this.playlist[i],this.playlist[j]]=[this.playlist[j],this.playlist[i]]; }
    this.pl=0;
  },
  _startReal(){
    if(!window.Audio) return false;
    this._shuffle();
    const el=new window.Audio();
    el.preload="auto";
    el.addEventListener("ended",()=>this._nextReal());
    el.addEventListener("error",()=>{
      LOG("song failed to load — falling back to the generative loop");
      this.realFailed=true; this._stopReal();
      if(this.musicOn) this._startGenerative();
    });
    this.el=el; this.elRouted=false;
    try{
      const ac=this.ensure();
      if(ac){ this.elSrc=ac.createMediaElementSource(el); this.elSrc.connect(this.musicGain); this.elRouted=true; }
      else el.volume=this.musicVol;
    }catch(e){ LOG("song routing unavailable:",e.message); el.volume=this.musicVol; }
    this._playTrack();
    return true;
  },
  _playTrack(){
    if(!this.el) return;
    this.el.src=SONGS_DIR+encodeURIComponent(this.playlist[this.pl%this.playlist.length]);
    this.el.play().catch(e=>LOG("song playback needs a tap first:",e.message));
  },
  _nextReal(){
    if(!this.el) return;
    this.pl++; if(this.pl>=this.playlist.length) this._shuffle();
    this._playTrack();
  },
  _stopReal(){ if(this.el){ this.el.pause(); this.el.removeAttribute("src"); this.el.load(); this.el=null; this.elSrc=null; } },
  _startGenerative(){
    if(!this.ensure()||!this.musicOn||this.timer) return;
    this.started=true;
    const beat=()=>{
      this.step++;
      const sc=this.SCALES[this.scaleName]||this.SCALES.cosy, root=this.ROOTS[this.scaleName]||174.6;
      const s=this.step;
      if(s%8===1){ this._pad(root*0.5*Math.pow(2,sc[(s/8|0)%4]/12),5.4); }
      if(s%2===1){
        const deg=sc[Math.floor(Math.random()*sc.length)];
        this._pluck(root*Math.pow(2,deg/12), 0.055+Math.random()*0.03);
      }
      if(s%4===0&&Math.random()<0.55) this._pluck(root*2*Math.pow(2,sc[Math.floor(Math.random()*4)]/12),0.03);
    };
    this.timer=setInterval(beat,640);
  },
  _pad(f,dur){
    const ac=this.ac; if(!ac) return; const t=ac.currentTime;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.13,t+1.4); g.gain.linearRampToValueAtTime(0,t+dur);
    const flt=ac.createBiquadFilter(); flt.type="lowpass"; flt.frequency.value=820;
    [1,1.005,1.5].forEach((m,i)=>{ const o=ac.createOscillator(); o.type=i===2?"sine":"triangle";
      o.frequency.value=f*m; o.connect(flt); o.start(t); o.stop(t+dur); });
    flt.connect(g); g.connect(this.musicGain); if(this.verb) g.connect(this.verb);
  },
  _pluck(f,amp){
    const ac=this.ac; if(!ac) return; const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain(), flt=ac.createBiquadFilter();
    o.type="sine"; o.frequency.value=f;
    flt.type="lowpass"; flt.frequency.setValueAtTime(2600,t); flt.frequency.exponentialRampToValueAtTime(700,t+0.5);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(amp,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    o.connect(flt); flt.connect(g); g.connect(this.musicGain); if(this.verb) g.connect(this.verb);
    o.start(t); o.stop(t+0.95);
  },
  /* ── SFX ── */
  sfx(kind,detune){
    const ac=this.ensure(); if(!ac||!this.sfxOn) return;
    const t=ac.currentTime, out=this.sfxGain;
    const tone=(f0,f1,dur,type,amp,delay)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(f0,t+(delay||0));
      if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+(delay||0)+dur);
      g.gain.setValueAtTime(0,t+(delay||0));
      g.gain.linearRampToValueAtTime(amp||0.2,t+(delay||0)+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+(delay||0)+dur);
      o.connect(g); g.connect(out); o.start(t+(delay||0)); o.stop(t+(delay||0)+dur+0.02);
    };
    const noise=(dur,f,q,amp,delay)=>{
      const len=Math.floor(ac.sampleRate*dur), b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      const src=ac.createBufferSource(); src.buffer=b;
      const flt=ac.createBiquadFilter(); flt.type="bandpass"; flt.frequency.value=f; flt.Q.value=q||1;
      const g=ac.createGain(); g.gain.value=amp||0.16;
      src.connect(flt); flt.connect(g); g.connect(out); src.start(t+(delay||0));
    };
    const D=detune||1;
    switch(kind){
      case "click": tone(620*D,420*D,0.07,"triangle",0.13); break;
      case "pet": tone(520*D,760*D,0.13,"sine",0.16); tone(780*D,980*D,0.1,"sine",0.07,0.05); break;
      case "purr": for(let i=0;i<7;i++) noise(0.09,180+Math.random()*70,6,0.075,i*0.075); break;
      case "meow": tone(560*D,880*D,0.14,"sawtooth",0.09); tone(880*D,470*D,0.22,"sawtooth",0.075,0.13); break;
      case "mew": tone(880*D,1180*D,0.1,"triangle",0.09); tone(1180*D,760*D,0.14,"triangle",0.06,0.09); break;
      case "eat": noise(0.07,900,3,0.14); noise(0.07,700,3,0.12,0.13); noise(0.06,1100,3,0.1,0.26); break;
      case "coin": tone(940,0,0.09,"square",0.09); tone(1430,0,0.16,"square",0.08,0.06); break;
      case "cash": [0,0.07,0.14,0.21].forEach((d,i)=>tone(880+i*180,0,0.14,"square",0.07,d)); break;
      case "play": tone(440,900,0.13,"triangle",0.13); tone(900,660,0.13,"triangle",0.1,0.1); break;
      case "grow": [523,659,784,1047].forEach((f,i)=>tone(f,0,0.3,"triangle",0.11,i*0.09)); break;
      case "fanfare": [523,659,784,1047,1319].forEach((f,i)=>tone(f,0,0.45,"triangle",0.12,i*0.1));
        noise(0.5,2400,1,0.06,0.42); break;
      case "yawn": tone(300,190,0.5,"sine",0.1); break;
      case "alarm": tone(760,420,0.22,"square",0.13); tone(760,420,0.22,"square",0.13,0.28); break;
      case "scratch": noise(0.16,1500,2,0.15); noise(0.14,1200,2,0.12,0.13); break;
      case "splash": noise(0.3,700,0.7,0.16); tone(340,140,0.24,"sine",0.08); break;
      case "pop": tone(700*D,1500*D,0.06,"sine",0.15); break;
      case "whoosh": noise(0.28,600,0.6,0.1); break;
      case "combo": tone(600*D,1400*D,0.1,"square",0.1); break;
      case "fail": tone(320,160,0.3,"sawtooth",0.1); break;
      case "tick": tone(1500,0,0.03,"square",0.05); break;
      case "unlock": [659,880,1047].forEach((f,i)=>tone(f,0,0.35,"sine",0.12,i*0.08)); break;
      case "shutter": noise(0.05,3000,1,0.2); noise(0.07,1200,1,0.16,0.07); break;
    }
  }
};

/* ═══════════════════════ 5. SHAPE PAINTERS ═══════════════════════
   Each painter draws one object, bottom-aligned in an S×S cell, using only
   the supplied colour mapper C(luma 0..1, alpha). Baked once into the atlas
   in greyscale; the shader re-tints with a two-colour ramp, so "Eucalypt
   Chesterfield" and "Midnight Chesterfield" cost one texture between them. */
function rr(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2); g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function box(g,x,y,w,h,r,col){ rr(g,x,y,w,h,r); g.fillStyle=col; g.fill(); }
function ell(g,x,y,rx,ry,col){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,6.2832); g.fillStyle=col; g.fill(); }
function line(g,x1,y1,x2,y2,w,col){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2);
  g.lineWidth=w; g.strokeStyle=col; g.lineCap="round"; g.stroke(); }
function poly(g,pts,col){ g.beginPath(); g.moveTo(pts[0],pts[1]);
  for(let i=2;i<pts.length;i+=2) g.lineTo(pts[i],pts[i+1]); g.closePath(); g.fillStyle=col; g.fill(); }
/* contact shadow puddle under floor-standing pieces */
function shadow(g,S,w){ ell(g,S/2,S-4,w*0.5,5,"rgba(0,0,0,0.13)"); }

const SHAPES={

function moodOf(c){
  if(c.sleeping) return "sleepy";
  if(isBreeding(c)||now()<c.loveUntil) return "love";
  if(c.energy<22) return "tired";
  if(wellbeing(c)<30||c.mood<28) return "sad";
  if(c.sick) return "sad";
  if(c.mood>=78) return "happy";
  return "content";
}
function eyeSVG(ex,ey,mood,col,sc){
  sc=sc||1;
  if(mood==="sleepy"||mood==="tired")
    return `<path d="M ${ex-6*sc} ${ey} q ${6*sc} ${5*sc} ${12*sc} 0" stroke="${col}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  if(mood==="happy")
    return `<path d="M ${ex-6*sc} ${ey+2} q ${6*sc} ${-9*sc} ${12*sc} 0" stroke="${col}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
  if(mood==="love")
    return `<path d="M ${ex} ${ey+5*sc} C ${ex-6*sc} ${ey-2*sc}, ${ex-1*sc} ${ey-6*sc}, ${ex} ${ey-2*sc} C ${ex+1*sc} ${ey-6*sc}, ${ex+6*sc} ${ey-2*sc}, ${ex} ${ey+5*sc} Z" fill="#ED5A78"/>`;
  if(mood==="sad")
    return `<ellipse cx="${ex}" cy="${ey+1}" rx="${3.4*sc}" ry="${4.4*sc}" fill="${col}"/><path d="M ${ex-7*sc} ${ey-6*sc} l ${9*sc} 3" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;

}

function visualSig(c){
  const si=stageIndex(c);
  return [si,moodOf(c),c.tummy<30?"H":"",c.hygiene<35?"D":"",c.sick?"S":"",c.breed,c.face,
    COSTUME_SLOTS.map(s=>(c.wear&&c.wear[s])||"-").join("|")].join("");
}
function buildCatSVG(c){
  const si=stageIndex(c), S=STAGES[si], B=BREEDS[c.breed]||BREEDS.cream;
  const mood=moodOf(c), hungry=c.tummy<30&&mood!=="sleepy", dirty=c.hygiene<35;
  const fur=B.fur, shade=B.shade, belly=B.belly, ink=(B.tux||B.points)?"#2c2c33":"#3f3128", nose=B.nose;
  const floorY=168, thin=hungry?0.9:1;
  const hR=S.headR, bRx=S.bodyRx*thin, bRy=S.bodyRy;
  const by=floorY-S.legLen-bRy*0.55, bx=84;
  const hx=bx+bRx*0.78+hR*0.35, hy=by-bRy*0.55-hR*0.30;
  const legTop=by+bRy*0.35, lw=Math.max(8,bRx*0.20);
  const leg=(cls,x,col,back)=>{ const top=legTop+(back?2:0);
    return `<g class="${cls}"><rect x="${x-lw/2}" y="${top}" width="${lw}" height="${floorY-top}" rx="${lw/2}" fill="${col}"/>`+
      `<ellipse cx="${x}" cy="${floorY}" rx="${lw*0.62}" ry="4" fill="${col}" stroke="${shade}" stroke-width="1" stroke-opacity=".3"/></g>`; };
  const backX=bx-bRx*0.52, frontX=bx+bRx*0.50;
  const ts=S.tailSc, txs=bx-bRx*0.88, tys=by+bRy*0.2;
  const tail=`<path class="tail" d="M ${txs} ${tys}
     C ${txs-22*ts} ${tys+2}, ${txs-34*ts} ${tys-20*ts}, ${txs-28*ts} ${tys-42*ts}
     C ${txs-24*ts} ${tys-56*ts}, ${txs-8*ts} ${tys-56*ts}, ${txs-9*ts} ${tys-40*ts}
     C ${txs-11*ts} ${tys-28*ts}, ${txs-9*ts} ${tys-14*ts}, ${txs+5} ${tys-3} Z" fill="${shade}"/>`;
  const body=`<ellipse cx="${bx}" cy="${by}" rx="${bRx}" ry="${bRy}" fill="${fur}"/>`+
    `<ellipse cx="${bx-bRx*0.6}" cy="${by+bRy*0.05}" rx="${bRx*0.42}" ry="${bRy*0.95}" fill="${fur}"/>`+
    `<path d="M ${bx+bRx*0.35} ${by-bRy*0.7} Q ${hx-hR*0.5} ${hy+hR*0.2}, ${hx-hR*0.2} ${hy+hR*0.85}
        L ${hx-hR*0.2} ${by+bRy*0.4} Q ${bx+bRx*0.5} ${by+bRy*0.9}, ${bx+bRx*0.3} ${by+bRy*0.2} Z" fill="${fur}"/>`;
  const bellyPatch=`<ellipse cx="${bx+bRx*0.05}" cy="${by+bRy*0.5}" rx="${bRx*0.62}" ry="${bRy*0.5}" fill="${belly}"/>`;
  const es=S.earSc;
  const earBackO=`M ${hx-hR*0.62} ${hy-hR*0.5} L ${hx-hR*0.98*es} ${hy-hR*1.46*es} L ${hx+hR*0.02} ${hy-hR*0.92} Z`;
  const earFrontO=`M ${hx+hR*0.28} ${hy-hR*0.72} L ${hx+hR*0.64*es} ${hy-hR*1.5*es} L ${hx+hR*0.92} ${hy-hR*0.5} Z`;
  const earBackI=`M ${hx-hR*0.55} ${hy-hR*0.55} L ${hx-hR*0.8*es} ${hy-hR*1.2*es} L ${hx-hR*0.12} ${hy-hR*0.86} Z`;
  const earFrontI=`M ${hx+hR*0.36} ${hy-hR*0.7} L ${hx+hR*0.6*es} ${hy-hR*1.24*es} L ${hx+hR*0.82} ${hy-hR*0.52} Z`;

/* room bonuses derived from whatever's actually placed in the room */
function roomFx(r){
  if(r._fxCache && r._fxAt===r.placed.length+(r._fxTag||0)) return r._fxCache;
  const fx={bed:0,sleep:0,energy:0,mood:0,moodSlow:0,tummySlow:0,perch:0,scratch:0,litter:0,feeder:0,play:0,light:0};
  for(const p of r.placed){ const it=ITEM_BY_ID[p.item]; if(!it||!it.fn) continue;
    fx[it.fn.k]=Math.max(fx[it.fn.k]||0, it.fn.v); }
  r._fxCache=fx; r._fxAt=r.placed.length+(r._fxTag||0);
  return fx;
}
function invalidateFx(r){ r._fxTag=(r._fxTag||0)+1; r._fxCache=null; }

/* ═══════════════════════ 10. VIEW & CAMERA ═══════════════════════ */
const HORIZON=0.56;                 // wall/floor split, as a fraction of stage height
const CAT_BAND=[0.70,0.955];        // cats keep to the front strip so they read in front
const View={
  stage:null, w:0, h:0, dpr:1, camX:0, camTarget:0, worldW:0,
  room:null, fx:null, mode2D:false,
  init(){
    this.stage=document.getElementById("stage");
    const rc=document.getElementById("glRoom"), fc=document.getElementById("glFx");
    this.room=makeGL(rc); this.fx=makeGL(fc);
    if(!this.room){ this.room=make2D(rc); this.mode2D=true; LOG("room: canvas2d fallback"); }
    if(!this.fx){ this.fx=make2D(fc); }
    this.measure();
    markRoomDirty();
    addEventListener("resize",()=>this.measure(),{passive:true});
    /* A lost WebGL context (GPU reclaimed after the tab was backgrounded,
       a driver reset, low memory) otherwise leaves the room permanently
       blank with no error — the classic "no pictures" report. Rebuild
       on restore instead of just going dark forever. */
    [rc,fc].forEach(cv=>{
      cv.addEventListener("webglcontextlost",e=>{ e.preventDefault(); LOG("webgl context lost"); },false);
      cv.addEventListener("webglcontextrestored",()=>{ LOG("webgl context restored"); this.rebuildGL(); },false);
    });
  },
  rebuildGL(){
    const rc=document.getElementById("glRoom"), fc=document.getElementById("glFx");
    const newRoom=makeGL(rc);
    this.room=newRoom||make2D(rc); this.mode2D=!newRoom;
    this.fx=makeGL(fc)||make2D(fc);
    this.measure();
    Atlas.build();
    this.room.uploadAtlas(Atlas.canvas);
    this.fx.uploadAtlas(Atlas.canvas);
    markRoomDirty();
  },
  measure(){
    const r=this.stage.getBoundingClientRect();
    this.w=r.width; this.h=r.height;
    this.dpr=Math.min(devicePixelRatio||1,1.75);
    this.room.resize(this.w,this.h,this.dpr);
    this.fx.resize(this.w,this.h,this.dpr);
    this.recalcWorld();
  },
  recalcWorld(){
    const r=state?activeRoom():null;
    this.worldW=this.w*(r?roomWidth(r):2);
    this.camTarget=clamp(this.camTarget,0,Math.max(0,this.worldW-this.w));
    this.camX=clamp(this.camX,0,Math.max(0,this.worldW-this.w));
  },
  maxCam(){ return Math.max(0,this.worldW-this.w); },
  toScreen(x,y){ return [x*this.worldW-this.camX, y*this.h]; },
  centreOn(x){ this.camTarget=clamp(x*this.worldW-this.w/2,0,this.maxCam()); }
};

/* ── time of day drives lighting, cat behaviour and ambience ── */
function daySlot(){
  const h=new Date().getHours();
  if(h<5) return "night"; if(h<8) return "dawn"; if(h<12) return "morning";
  if(h<17) return "day"; if(h<20) return "dusk"; return "night";
}
const DAY_LOOK={
  dawn:   {tint:[1.0,0.80,0.72,0.11], label:"Dawn",     icon:"🌅"},
  morning:{tint:[1.0,0.97,0.86,0.04], label:"Morning",  icon:"☀️"},
  day:    {tint:[1.0,1.0,1.0,0.0],    label:"Afternoon",icon:"🌤️"},
  dusk:   {tint:[0.95,0.66,0.62,0.13],label:"Dusk",     icon:"🌇"},
  night:  {tint:[0.34,0.36,0.66,0.34],label:"Night",    icon:"🌙"}
};
function currentTint(){
  const slot=daySlot(), L=DAY_LOOK[slot];
  if(!state||!state.settings.dayNight) return [1,1,1,0];
  const t=L.tint.slice();
  const r=activeRoom();
  if(r){ const fx=roomFx(r);
    if(fx.light>0 && (slot==="night"||slot==="dusk")) t[3]*=0.42;      // lamps push back the dark
    const th=ROOM_THEMES.find(x=>x.id===r.theme);
    if(th&&th.amb){ t[0]*=th.amb[0]; t[1]*=th.amb[1]; t[2]*=th.amb[2]; }
  }
  return t;
}

/* ═══════════════════════ 11. ROOM RENDER ═══════════════════════ */
let ambientTimer=0, lastRoomSig="", roomForceAt=0;
/* The room is a static scene: walls, floor, furniture. Redrawing it 60 times a
   second burns GPU for nothing, so we only repaint when the picture changes.
   Animated wallpapers (the starfield twinkles) get a slow 6fps refresh. */
function roomNeedsRedraw(tSec){
  const r=activeRoom(), V=View, t=currentTint();
  const animated=(PATTERNS[(ITEM_BY_ID[r.wp]&&ITEM_BY_ID[r.wp].data||WALLPAPERS[0]).pat]===5);
  const sig=[Math.round(V.camX),Math.round(V.w),Math.round(V.h),r.id,r.wp,r.fl,
    r.placed.length,r._fxTag||0,Deco.dragging?r.placed.indexOf(Deco.dragging):-1,
    Deco.dragging?Math.round(Deco.dragging.x*400)+","+Math.round(Deco.dragging.y*400):"",
    t.map(v=>v.toFixed(2)).join(",")].join("|");
  if(sig!==lastRoomSig){ lastRoomSig=sig; return true; }
  if(animated&&tSec-roomForceAt>0.16){ roomForceAt=tSec; return true; }
  return false;
}
function markRoomDirty(){ lastRoomSig=""; }
function drawRoom(tSec){
  if(!state) return;
  const r=activeRoom(), V=View;
  const wp=(ITEM_BY_ID[r.wp]&&ITEM_BY_ID[r.wp].data)||WALLPAPERS[0];
  const fl=(ITEM_BY_ID[r.fl]&&ITEM_BY_ID[r.fl].data)||FLOORS[0];
  const rgb=h=>hexRGB(h).map(v=>v/255);
  const tint=currentTint();
  V.room.clear();
  V.room.bg({
    camX:V.camX, worldW:V.worldW, dpr:V.dpr, time:tSec, horizon:HORIZON,
    pattern:PATTERNS[wp.pat]||0,
    wallA:rgb(wp.a), wallB:rgb(wp.b), skirt:rgb(wp.sk),
    floorA:rgb(fl.a), floorB:rgb(fl.b), tint
  });
  // furniture, back to front
  V.room.begin();
  const list=r.placed.slice().sort((a,b)=>a.y-b.y);
  for(const p of list){
    const it=ITEM_BY_ID[p.item]; if(!it||it.kind!=="furni") continue;
    const sx=p.x*V.worldW, sy=p.y*V.h;
    if(sx< V.camX-160 || sx> V.camX+V.w+160) continue;      // cull off-screen
    const t=Math.max(0,(p.y-HORIZON)/(1-HORIZON));
    const sc=it.zone==="wall"?1:(0.74+t*0.46);
    const wpx=it.w*sc, hpx=wpx;                              // cells are square
    const drag=(Deco.dragging&&Deco.dragging.u===p.u);
    V.room.push(sx,sy,(p.flip||1)<0?-wpx:wpx,hpx,uvFor(it.shape),rgb(it.lo),rgb(it.hi),drag?0.6:1,0);
  }
  V.room.flush(V.camX,0,tint,V.dpr);
}
function uvFor(shape){
  const uv=Atlas.uv(shape);
  return View.mode2D?{shape,u0:uv.u0,v0:uv.v0,u1:uv.u1,v1:uv.v1}:uv;
}
