const PSHAPE={dot:0,spark:1,star:2,heart:3,confetti:4,petal:5,snow:6,bubble:7,note:8};
function burst(kind,sxScreen,syScreen,opts){
  if(!state||!state.settings.particles) return;
  opts=opts||{};
  const wx=sxScreen+View.camX, wy=syScreen;
  const n=opts.n||14;
  const C=opts.colours||[[1,.85,.4],[1,.6,.7],[.6,.85,1]];
  for(let i=0;i<n;i++){
    const a=opts.dir!==undefined?opts.dir+rnd(-0.6,0.6):rnd(0,6.283);
    const sp=rnd(opts.spMin||40,opts.spMax||170);
    const c=pick(C);
    Particles.spawn(wx+rnd(-6,6), wy+rnd(-6,6), Math.cos(a)*sp, Math.sin(a)*sp-(opts.lift||60),
      rnd(opts.lifeMin||0.6,opts.lifeMax||1.5), rnd(opts.szMin||7,opts.szMax||16),
      c[0],c[1],c[2], rnd(-5,5), PSHAPE[opts.shape||"spark"]);
  }
}
function confettiRain(n){
  if(!state||!state.settings.particles) return;
  const C=[[1,.78,.3],[.96,.45,.55],[.55,.8,.95],[.6,.88,.6],[.8,.6,.95]];
  for(let i=0;i<(n||90);i++){
    const c=pick(C);
    Particles.spawn(View.camX+rnd(0,View.w), rnd(-140,-10), rnd(-40,40), rnd(30,120),
      rnd(1.6,3.2), rnd(8,15), c[0],c[1],c[2], rnd(-7,7), PSHAPE.confetti);
  }
}
function ambientSpawn(dt){
  if(!state||!state.settings.particles) return;
  ambientTimer-=dt;
  if(ambientTimer>0) return;
  ambientTimer=0.75;
  const r=activeRoom(), slot=daySlot();
  const th=r.theme;
  // dust motes drifting in the light — always, but livelier by day
  if(slot!=="night"&&Math.random()<0.55){
    Particles.spawn(View.camX+rnd(-40,View.w+40), rnd(View.h*0.15,View.h*0.75),
      rnd(-6,12), rnd(-9,-2), rnd(4,7.5), rnd(3,6), 1,0.97,0.85, 0, PSHAPE.dot);
  }
  if(th==="sakura"&&Math.random()<0.35){
    Particles.spawn(View.camX+rnd(-30,View.w+30), -12, rnd(-14,10), rnd(14,30),
      rnd(4,7), rnd(9,15), 1,0.76,0.85, rnd(-2,2), PSHAPE.petal);
  }
  if((th==="space")&&Math.random()<0.25){
    Particles.spawn(View.camX+rnd(0,View.w), rnd(0,View.h*0.5), rnd(-4,4), rnd(-4,4),
      rnd(2,4), rnd(4,8), 0.85,0.9,1, 0, PSHAPE.star);
  }
  if(th==="spooky"&&Math.random()<0.22){

let fxWasEmpty=true;
function drawParticles(dt){
  const V=View;
  Particles.step(dt, 55, 0.992, 0);
  if(!Particles.count){                 // nothing to draw — clear once, then leave it alone
    if(!fxWasEmpty){ V.fx.clear(); fxWasEmpty=true; }
    return;
  }
  fxWasEmpty=false;
  V.fx.clear();
  V.fx.begin();
  const d=Particles.inst;
  for(let i=0;i<Particles.count;i++){
    const q=i*INST_STRIDE;
    const x=d[q], y=d[q+1], sz=d[q+2], rot=d[q+3];
    if(x<V.camX-40||x>V.camX+V.w+40) continue;
    const shape=PARTICLE_SHAPES[Particles.shapeOf[i]]||"pSpark";
    const c=[d[q+4],d[q+5],d[q+6]];
    V.fx.push(x, y+sz/2, sz, sz, uvFor(shape), c, c, d[q+7], rot);
  }
  V.fx.flush(V.camX,0,[0,0,0,0],V.dpr);
}

function positionSprites(){
  const V=View, t=now();
  for(const c of catsIn(state.activeRoom)){
    const el=spriteEls[c.id]; if(!el) continue;
    const si=stageIndex(c), px=STAGES[si].px;
    const depth=(c.y-CAT_BAND[0])/(CAT_BAND[1]-CAT_BAND[0]);
    const scale=0.80+depth*0.26;
    const xpx=c.x*V.worldW-V.camX;
    const ypx=c.y*V.h;
    if(xpx<-160||xpx>V.w+160){ el.style.visibility="hidden"; continue; }
    el.style.visibility="visible";
    const hop=c.hop?Math.abs(Math.sin(c.hop))*4:0;
    el.style.transform=`translate(${xpx-px*0.556*scale}px, ${-(V.h-ypx)-hop}px) scale(${scale})`;
    el.style.zIndex=String(Math.round(c.y*200)+(c.id===state.selected?400:0));
    const moving=!c.sleeping&&c.hop>0.1&&!(c.freezeUntil&&t<c.freezeUntil);
    el.classList.toggle("walking",moving);
    el.classList.toggle("sleeping",!!c.sleeping);
    el.classList.toggle("breeding",isBreeding(c)&&!c.sleeping);
  }
}

function earnCoins(amount,ignoreCap){
  if(amount<=0) return 0;
  const t=now();
  if(!state.earnWindowStart||t-state.earnWindowStart>=3600000){ state.earnWindowStart=t; state.earnedThisHour=0; }
  if(ignoreCap){ state.pts+=amount; return amount; }
  const cap=EARN_CAP_PER_HOUR+(state.coinCapBonus||0);
  const remaining=Math.max(0,cap-(state.earnedThisHour||0));
  const grant=Math.min(amount,remaining);
  if(grant>0){ state.pts+=grant; state.earnedThisHour=(state.earnedThisHour||0)+grant; }
  return grant;
}

const thumbCache=new Map();
function thumbFor(item,size){
  size=size||96;
  const key=item.id+"@"+size;
  let c=thumbCache.get(key);
  if(c) return c;
  c=document.createElement("canvas"); c.width=c.height=size;
  const g=c.getContext("2d");
  g.scale(size/CELL,size/CELL);
  try{
    if(item.kind==="furni"&&SHAPES[item.shape]) SHAPES[item.shape](g,CELL,duotone(item.lo,item.hi));
    else if(item.kind==="wallpaper"){
      const d=item.data;
      const gr=g.createLinearGradient(0,0,0,CELL); gr.addColorStop(0,d.a); gr.addColorStop(1,d.b);
      g.fillStyle=gr; g.fillRect(0,0,CELL,CELL);
      g.fillStyle=d.sk; g.fillRect(0,CELL-18,CELL,18);
      g.globalAlpha=.35; g.fillStyle="#fff";
      if(d.pat==="stripes") for(let i=0;i<7;i++) g.fillRect(i*19,0,9,CELL-18);
      if(d.pat==="dots") for(let i=0;i<4;i++) for(let j=0;j<4;j++){ g.beginPath(); g.arc(18+i*32,18+j*26,5,0,6.3); g.fill(); }
      if(d.pat==="tile"){ g.strokeStyle="#fff"; g.lineWidth=2; for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(i*32,0); g.lineTo(i*32,CELL); g.moveTo(0,i*28); g.lineTo(CELL,i*28); g.stroke(); } }
      if(d.pat==="boards") for(let i=0;i<5;i++) g.fillRect(i*26,0,3,CELL-18);
      if(d.pat==="stars"){ for(let i=0;i<14;i++){ g.beginPath(); g.arc(((i*37)%120)+4,((i*53)%96)+6,2,0,6.3); g.fill(); } }
      if(d.pat==="blossom"){ for(let i=0;i<10;i++){ g.beginPath(); g.arc(((i*41)%118)+5,((i*29)%94)+8,6,0,6.3); g.fill(); } }
      g.globalAlpha=1;
    } else if(item.kind==="floor"){
      const d=item.data;
      const gr=g.createLinearGradient(0,0,0,CELL); gr.addColorStop(0,d.a); gr.addColorStop(1,d.b);
      g.fillStyle=gr; g.fillRect(0,0,CELL,CELL);
      g.globalAlpha=.3; g.fillStyle="#000";
      for(let i=0;i<6;i++) g.fillRect(0,i*22+8,CELL,2);
      g.globalAlpha=1;
    } else if(item.kind==="costume"){
      g.font="76px system-ui"; g.textAlign="center"; g.textBaseline="middle";
      g.fillText(COSTUME_EMOJI[item.id]||"👑",CELL/2,CELL/2+6);
    } else if(item.kind==="toy"){
      g.font="76px system-ui"; g.textAlign="center"; g.textBaseline="middle";
      g.fillText(item.toy.e,CELL/2,CELL/2+6);
    } else if(item.kind==="bundle"){
      g.font="70px system-ui"; g.textAlign="center"; g.textBaseline="middle";
      g.fillText("🎁",CELL/2,CELL/2+6);
    }
  }catch(e){}
  thumbCache.set(key,c);
  if(thumbCache.size>500) thumbCache.delete(thumbCache.keys().next().value);
  return c;
}

function grantReward(a){
  const rw=a.rw||{}; const bits=[];
  if(rw.coins){ state.pts+=rw.coins; bits.push(`+${rw.coins} coins`); }
  if(rw.item){ state.owned[rw.item]=1; const it=ITEM_BY_ID[rw.item]; bits.push(it?`“${it.name}”`:"a gift"); }

function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function rollQuests(){
  const pool=QUEST_POOL.slice().sort(()=>Math.random()-0.5).slice(0,3);
  state.questDay=todayKey();
  state.quests=pool.map(q=>({...q, base:state.stats[q.k]||0, done:false, claimed:false}));
}
function ensureQuests(){ if(!state.quests||state.questDay!==todayKey()) rollQuests(); }
function questProgress(q){ return clamp((state.stats[q.k]||0)-q.base, 0, q.goal); }
function readyQuests(){ if(!state||!state.quests) return 0; return state.quests.filter(q=>!q.claimed&&questProgress(q)>=q.goal).length; }
function claimQuest(q){
  if(q.claimed||questProgress(q)<q.goal) return;
  q.claimed=true; state.pts+=q.rw;
  Audio.sfx("cash"); bumpWallet(); toast(`Quest done — ${q.rw} coins 🪙`);
  confettiRain(40); renderHUD(); saveGame(); refreshSheet();
}
const STREAK_REWARD=d=>Math.min(140, 18+d*11);
function touchStreak(){
  const t=todayKey();
  if(state.lastCareDay===t) return;
  const y=new Date(Date.now()-86400000);
  const yk=`${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
  state.streak=(state.lastCareDay===yk)?(state.streak||0)+1:1;
  state.lastCareDay=t;
  const rw=STREAK_REWARD(state.streak);
  state.pts+=rw;
  for(const c of state.cats) c.bond=clamp(c.bond+BOND_PER_DAY_CARED);
  Audio.sfx("cash"); confettiRain(60);

/* ═══════════════════════ 17. DECORATE MODE ═══════════════════════ */
const Deco={
  on:false, snap:true, dragging:null, grid:0.02,
  toggle(v){
    this.on=v===undefined?!this.on:v; markRoomDirty();
    document.body.classList.toggle("decorating",this.on);
    const db=document.getElementById("decoBtn"); if(db) db.classList.toggle("active",this.on);
    document.getElementById("hint").textContent=this.on
      ? "Drag pieces to move them · tap one to flip or store it"
      : "Drag the room sideways to explore · tap a cat to pet it 💗";
    this.dragging=null;
    document.getElementById("dbStore").style.display="none";
    if(!this.on) saveGame();
  },
  hitTest(sx,sy){
    const r=activeRoom(), V=View;
    const list=r.placed.slice().sort((a,b)=>b.y-a.y);
    for(const p of list){
      const it=ITEM_BY_ID[p.item]; if(!it||it.kind!=="furni") continue;
      const t=Math.max(0,(p.y-HORIZON)/(1-HORIZON));
      const sc=it.zone==="wall"?1:(0.74+t*0.46);
      const w=it.w*sc, h=w;
      const cx=p.x*V.worldW-V.camX, cy=p.y*V.h;
      if(sx>=cx-w/2&&sx<=cx+w/2&&sy>=cy-h&&sy<=cy) return p;
    }
    return null;
  },
  place(itemId){
    const r=activeRoom(), it=ITEM_BY_ID[itemId]; if(!it) return;
    const cx=(View.camX+View.w/2)/View.worldW;
    const y=it.zone==="wall"?rnd(0.14,0.40):rnd(0.66,0.90);
    const p={u:uid("p"), item:itemId, x:clamp(cx,0.03,0.97), y, flip:1};
    r.placed.push(p);
    state.stats.placed++;
    invalidateFx(r); markRoomDirty();
    Audio.sfx("pop"); toast(`Placed ${it.name}`);
    checkAchievements(); saveGame();
    return p;
  },
  store(p){
    const r=activeRoom();
    r.placed=r.placed.filter(x=>x.u!==p.u);
    invalidateFx(r); markRoomDirty(); this.dragging=null;
    document.getElementById("dbStore").style.display="none";
    Audio.sfx("click"); toast("Popped back in storage");
    saveGame();
  },
  moveTo(p,sx,sy){
    const it=ITEM_BY_ID[p.item];
    let x=(sx+View.camX)/View.worldW;
    let y=sy/View.h;
    if(it.zone==="wall") y=clamp(y,0.06,HORIZON-0.04);
    else y=clamp(y,HORIZON+0.02,0.97);
    x=clamp(x,0.02,0.98);
    if(this.snap){ x=Math.round(x/this.grid)*this.grid; y=Math.round(y/(this.grid*1.5))*(this.grid*1.5); }
    p.x=x; p.y=y; markRoomDirty();
  }
};

/* ═══════════════════════ 18. STAGE INPUT ═══════════════════════ */
function bindStage(){
  const st=View.stage;
  let mode=null, sx0=0, sy0=0, cam0=0, moved=false, lastX=0, vel=0, lastT=0;
  const local=e=>{ const r=st.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };

  st.addEventListener("pointerdown",e=>{
    Audio.resume();
    if(e.target.closest(".decoBar")||e.target.closest(".nameChip")) return;
    const [x,y]=local(e);
    moved=false; sx0=x; sy0=y; cam0=View.camX; lastX=x; lastT=performance.now(); vel=0;
    if(Deco.on){
      const hit=Deco.hitTest(x,y);
      if(hit){ mode="item"; Deco.dragging=hit; document.getElementById("dbStore").style.display="block";
        try{ st.setPointerCapture(e.pointerId); }catch(_){}
        return; }
    }
    mode="pan"; st.classList.add("dragging");
    try{ st.setPointerCapture(e.pointerId); }catch(_){}
  });
  st.addEventListener("pointermove",e=>{
    if(!mode) return;
    const [x,y]=local(e);
    if(Math.abs(x-sx0)>5||Math.abs(y-sy0)>5) moved=true;
    if(mode==="item"&&Deco.dragging){ Deco.moveTo(Deco.dragging,x,y); return; }
    if(mode==="pan"){
      const t=performance.now();
      if(t>lastT){ vel=(x-lastX)/(t-lastT); lastX=x; lastT=t; }
      View.camTarget=clamp(cam0-(x-sx0),0,View.maxCam());
      View.camX=View.camTarget;
    }
  });
  const end=e=>{
    if(!mode) return;
    const [x,y]=local(e);
    st.classList.remove("dragging");
    if(mode==="item"){
      if(!moved && Deco.dragging){ showItemMenu(Deco.dragging); }
      else { invalidateFx(activeRoom()); saveGame(); }
    } else if(mode==="pan"){
      if(!moved) tapWorld(x,y);
      else View.camTarget=clamp(View.camX-vel*220,0,View.maxCam());   // gentle flick
    }
    mode=null;
  };
  st.addEventListener("pointerup",end);
  st.addEventListener("pointercancel",()=>{ mode=null; st.classList.remove("dragging"); });
  st.addEventListener("wheel",e=>{
    View.camTarget=clamp(View.camTarget+(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY),0,View.maxCam());
    e.preventDefault();
  },{passive:false});

  document.getElementById("catsLayer").addEventListener("click",e=>{
    const sprite=e.target.closest(".catSprite"); if(!sprite) return;
    const id=sprite.dataset.cat, c=state.cats.find(x=>x.id===id); if(!c) return;
    const zoneEl=e.target.closest(".zone");
    Audio.resume();
    if(state.selected!==id){ selectCat(id); if(zoneEl) petCat(c,zoneEl.dataset.zone,e.clientX,e.clientY); }
    else if(zoneEl) petCat(c,zoneEl.dataset.zone,e.clientX,e.clientY);
    else selectCat(id);
  });
}
/* a tap on the room itself: clean a mess, use a piece of furniture */
function tapWorld(sx,sy){
  const r=activeRoom(), V=View;
  for(const p of r.poops){
    const [px,py]=V.toScreen(p.x,p.y);
    if(Math.abs(px-sx)<22&&Math.abs(py-sy)<24){ cleanPoop(p); return; }
  }
  const hit=Deco.hitTest(sx,sy);
  if(hit){ useFurniture(hit); return; }
}
function useFurniture(p){
  const it=ITEM_BY_ID[p.item]; if(!it) return;
  const r=activeRoom(), c=selectedCat();
  const fnk=it.fn&&it.fn.k;
  if(fnk==="litter"){
    cleanLitterAt(r,p.u); return;
  }
  if(fnk==="feeder"){ openSheet("itemMenu",null,{p}); return; }
  if(fnk==="scratch"){
    if(!c) return;
    if(c.sleeping){ c.sleeping=false; c.behavior="wander"; }
    c.mood=clamp(c.mood+5*MOOD_GAIN_SCALE); c.loveUntil=now()+700;
    Audio.sfx("scratch"); emote("*scratch!* 🪵"); spriteAnim(c,"scratch",700); c._sig=null;
    renderHUD(); syncSprites(); saveGame(); return;
  }
  if(fnk==="play"){
    const t=TOYS.find(x=>state.toys.includes(x.id));
    if(t) playToy(t); else toast("Buy a toy from the shop first 🧶");
    return;
  }
  toast(it.name+(it.fn?` — ${FN_DESC[it.fn.k]}`:""));
}

/* ═══════════════════════ 19. ROOM FIXTURES ═══════════════════════ */
function litterClean(r,u){ r.litterClean=r.litterClean||{}; if(r.litterClean[u]===undefined) r.litterClean[u]=100; return r.litterClean[u]; }
function setLitterClean(r,u,v){ r.litterClean=r.litterClean||{}; r.litterClean[u]=clamp(v); }
function feederAt(r,u){ r.feeders=r.feeders||{}; if(!r.feeders[u]) r.feeders[u]={level:1,feeds:0}; return r.feeders[u]; }
const FEEDER_FEED_FOOD=30, FEEDER_FILL_COST=6, FEEDER_MAX_LEVEL=15;
const feederUpCost=l=>10+l*5;
const feederCap=l=>8+(l-1)*2+(l>=FEEDER_MAX_LEVEL?2:0);
function roomLitterAvg(r){
  const L=litterSpots(r); if(!L.length) return 0;
  return L.reduce((s,p)=>s+litterClean(r,p.u),0)/L.length;
}
function bestLitterSpot(r,forCat){
  const L=litterSpots(r); if(!L.length) return null;
  const claimed=new Set(catsIn(r.id).filter(o=>o.id!==(forCat&&forCat.id)&&o._pottyBox).map(o=>o._pottyBox));
  const open=L.filter(p=>!claimed.has(p.u)).sort((a,b)=>litterClean(r,b.u)-litterClean(r,a.u));
  return open[0]||null;
}
function cleanLitterAt(r,u){
  if(litterClean(r,u)>=100){ toast("That tray's already spotless ✨"); return; }
  setLitterClean(r,u,100);
  const g=earnCoins(1); state.stats.cleaned++;
  Audio.sfx("pop"); emote("scooped! 🧹");
  toast(`Litter tray cleaned 🧹${g>0?" +1":""}`);
  bumpWallet(); touchStreak(); checkAchievements(); renderHUD(); saveGame();
}
function fillFeederAt(r,u){
  const F=feederAt(r,u), cap=feederCap(F.level);
  if(F.feeds>=cap){ toast("That feeder's chockers 🍚"); return; }
  if(state.pts<FEEDER_FILL_COST){ toast("Not enough coins to fill 🪙"); return; }
  let added=0;
  while(F.feeds<cap&&state.pts>=FEEDER_FILL_COST){ state.pts-=FEEDER_FILL_COST; F.feeds++; added++; }
  if(added){ Audio.sfx("coin"); bumpWallet(); emote(`filled +${added} 🍚`);
    toast(`Filled ${added} feed${added>1?"s":""} (−${added*FEEDER_FILL_COST} 🪙)`); }
  renderHUD(); saveGame(); refreshSheet();
}
function upgradeFeederAt(r,u){
  const F=feederAt(r,u);
  if(F.level>=FEEDER_MAX_LEVEL){ toast("That feeder's maxed out ✨"); return; }
  const cost=feederUpCost(F.level);
  if(!spend(cost)) return;
  F.level++;
  Audio.sfx("coin");
  toast(`Feeder upgraded to Lv${F.level} — holds ${feederCap(F.level)} feeds`);
  checkAchievements(); renderHUD(); saveGame(); refreshSheet();
}
function feederEat(c){
  const r=getRoom(c.roomId); if(!r) return false;
  const spots=feederSpots(r);
  for(const p of spots){
    const F=feederAt(r,p.u);
    if(F.feeds>0){
      F.feeds--;
      const greedy=traitOf(c)==="greedy";
      c.tummy=clamp(c.tummy+FEEDER_FEED_FOOD*(greedy?1.15:1));
      if(greedy&&!c.sick) c.growth+=6;
      c.loveUntil=now()+700; c.freezeUntil=now()+900;
      if(c.roomId===state.activeRoom){ spriteAnim(c,"eat",900); emote("nom (auto-feeder) 🍚"); }
      c._sig=null; saveGame(); return true;
    }
  }
  return false;
}

/* ═══════════════════════ 20. BEHAVIOUR ═══════════════════════ */
const playCooldownMs=c=>[16,26,38][stageIndex(c)]*60000;
const canPlayNow=c=>now()-(c.lastPlayAt||0)>=playCooldownMs(c);
function targetOf(p){ return {tx:clamp(p.x,0.04,0.96), ty:clamp(p.y+0.02,CAT_BAND[0],CAT_BAND[1])}; }
function wanderSpot(){ return {tx:rnd(0.05,0.95), ty:rnd(CAT_BAND[0],CAT_BAND[1])}; }

function assignBehavior(c){
  const r=getRoom(c.roomId), roll=Math.random(), slot=daySlot();
  c._pottyBox=null;
  if(isBreeding(c)){ c.behavior="wander"; const w=wanderSpot(); c.tx=w.tx; c.ty=w.ty; return; }

  // hungry → head for a stocked auto-feeder
  if(c.tummy<55){
    const fs=feederSpots(r).find(p=>feederAt(r,p.u).feeds>0);
    if(fs){ const t=targetOf(fs); c.tx=t.tx; c.ty=t.ty; c.behavior="goFeeder"; return; }
  }
  // tired → find a bed. Sleepy-heads and night-time make this much likelier.
  let napChance=0.5;
  if(traitOf(c)==="sleepy") napChance=0.75;
  if(slot==="night") napChance+=0.25;
  if(slot==="dawn") napChance-=0.2;
  if(c.energy<30&&roll<napChance){
    const bs=bedSpots(r);
    if(bs.length){ const t=targetOf(pick(bs)); c.tx=t.tx; c.ty=t.ty; }
    else { c.tx=c.x; c.ty=c.y; }
    c.behavior="goNap"; return;
  }
  // toilet, gated by real elapsed time
  let pottyChance=0.5;
  if(traitOf(c)==="accident") pottyChance=0.75;
  if(now()-(c.lastPottyAt||0)>POTTY_INTERVAL && roll<pottyChance){
    const box=bestLitterSpot(r,c);
    c._pottyBox=box?box.u:null;
    if(box){ const t=targetOf(box); c.tx=t.tx; c.ty=t.ty; }
    else { const w=wanderSpot(); c.tx=w.tx; c.ty=w.ty; }
    c.behavior="goPotty"; return;
  }
  // visit a friend
  const mates=catsIn(r.id).filter(o=>o.id!==c.id&&!o.sleeping);
  if(mates.length && roll<(traitOf(c)==="social"?0.22:0.12)){
    const m=pick(mates);
    c.behavior="goFriend"; c._friend=m.id;
    c.tx=clamp(m.x+rnd(-0.03,0.03),0.05,0.95); c.ty=clamp(m.y,CAT_BAND[0],CAT_BAND[1]); return;
  }
  // wander into the next room
  if(!c.closeDoor && state.rooms.length>1 && roll<0.10){
    c.behavior="goDoor"; c._exitFace=Math.random()<0.5?-1:1;
    c.tx=c._exitFace<0?-0.1:1.1; c.ty=rnd(CAT_BAND[0],CAT_BAND[1]); return;
  }
  // play with something in the room
  const ps=playSpots(r);
  if(roll<0.30 && (ps.length||state.toys.length) && canPlayNow(c)){
    c.behavior="goPlay";
    if(ps.length){ const t=targetOf(pick(ps)); c.tx=t.tx; c.ty=t.ty; }
    else { const w=wanderSpot(); c.tx=w.tx; c.ty=w.ty; }
    return;
  }
  // scratch — a post if there is one, otherwise your poor sofa
  const scratchChance=traitOf(c)==="scratchy"?0.55:0.40;
  if(roll<scratchChance){
    const ss=scratchSpots(r);
    if(ss.length){ const t=targetOf(pick(ss)); c.tx=t.tx; c.ty=t.ty; }
    else { const w=wanderSpot(); c.tx=w.tx; c.ty=w.ty; }
    c.behavior="goScratch"; return;
  }
  c.behavior="wander"; const w=wanderSpot(); c.tx=w.tx; c.ty=w.ty;
}
function arrive(c){
  const r=getRoom(c.roomId), active=c.roomId===state.activeRoom;
  switch(c.behavior){
    case "goDoor": moveCatToAdjacentRoom(c); return;
    case "goFeeder":
      if(!feederEat(c)&&active) emote("feeder's empty… 🍽️");
      break;
    case "goPotty": {
      c.lastPottyAt=now();
      const accident=traitOf(c)==="accident";
      const box=c._pottyBox?litterSpots(r).find(p=>p.u===c._pottyBox):null;
      if(box){
        const fill=100-litterClean(r,box.u);
        let miss=Math.min(0.35,fill/100*0.35)*0.30;
        if(accident) miss*=2;
        if(Math.random()>miss){
          setLitterClean(r,box.u,litterClean(r,box.u)-22);
          if(active){ spriteAnim(c,"squat",1100); emote("used the tray 🚽"); }
        } else {
          if(r.poops.length<12) r.poops.push({id:uid("p"),x:box.x,y:Math.min(0.95,box.y+0.03)});
          if(active){ spriteAnim(c,"squat",1100); emote("oops, missed! 💩"); }
        }
        c._pottyBox=null;
      } else if(r.poops.length<12){
        r.poops.push({id:uid("p"),x:c.x,y:c.y});
        if(active){ spriteAnim(c,"squat",1100); emote("no clean tray… 💩"); }
        if(active&&litterSpots(r).length<residentsOf(r.id).length)
          pushMsg(`${c.name} had no tray of their own — each cat wants one 🧰`,false);
      }
      break;
    }
    case "goPlay": {
      c.lastPlayAt=now();
      const naughty=traitOf(c)==="naughty";
      c.mood=clamp(c.mood+(naughty?6:4)*MOOD_GAIN_SCALE);
      c.energy=clamp(c.energy-(naughty?5:3));
      c.bond=clamp(c.bond+0.15);
      if(!c.sick) c.growth+=2;
      if(active){ spriteAnim(c,"play",700); emote("playing! "+pick(["🧶","🪶","🐭"]));
        const el=spriteEls[c.id];
        if(el){ const b=el.getBoundingClientRect(), s=View.stage.getBoundingClientRect();
          burst("play",b.left+b.width/2-s.left,b.top-s.top,{n:7,shape:"spark",colours:[[1,.9,.6]],lifeMax:0.9}); } }
      if(naughty&&Math.random()<0.22&&r.poops.length<12){
        r.poops.push({id:uid("p"),x:c.x,y:c.y});
        if(active) emote("knocked something over! 😼");
      }
      break;
    }
    case "goScratch": {
      const scratchy=traitOf(c)==="scratchy";
      if(scratchSpots(r).length){
        c.mood=clamp(c.mood+4*MOOD_GAIN_SCALE);
        if(active){ spriteAnim(c,"scratch",700); emote("*scratch* 🪵"); Audio.sfx("scratch"); }
      } else {
        r.couch=clamp(r.couch-(scratchy?5:2));
        if(active){ spriteAnim(c,"scratch",700); emote("*scratch* 😼"); }
        if(r.couch<=25) pushMsg(`Things are getting scratched up in ${r.name} — a post would help 🪵`,false);
      }
      break;
    }
    case "goFriend": {
      const m=state.cats.find(x=>x.id===c._friend);
      if(m&&m.roomId===c.roomId){
        c.friends=c.friends||{}; m.friends=m.friends||{};
        const key=m.id, lvl=(c.friends[key]||0)+1;
        c.friends[key]=lvl; m.friends[c.id]=lvl;
        const social=traitOf(c)==="social"||traitOf(m)==="social";
        const gain=(social?3:2)*MOOD_GAIN_SCALE;
        c.mood=clamp(c.mood+gain); m.mood=clamp(m.mood+gain);
        if(active){
          spriteAnim(c,"love",900); spriteAnim(m,"love",900);
          emote(lvl>6?pick(["best mates 🫂","grooming each other 💕"]):pick(["headbutt! 💗","hello there~"]));
          fxAtCat(c,"💗","#F38BA6");
        }
        if(lvl===7) pushMsg(`${c.name} and ${m.name} have become best mates 🫂`,false);
      }
      c._friend=null;
      break;
    }
    case "goNap":
      c.sleeping=true; c.behavior="nap"; c._sig=null;
      break;
  }
  if(c.behavior!=="nap"){ c.behavior="idle"; c.behaviorUntil=now()+4000+Math.random()*7000; }
}
function moveCatToAdjacentRoom(c){
  const others=state.rooms.filter(r=>r.id!==c.roomId);
  if(!others.length){ c.behavior="idle"; c.behaviorUntil=now()+3000; c.x=clamp(c.x,0.06,0.94); c.tx=c.x; return; }
  const dest=pick(others), fromActive=c.roomId===state.activeRoom;
  c.roomId=dest.id;
  c.x=c._exitFace<0?1.06:-0.06;
  const w=wanderSpot(); c.tx=w.tx; c.ty=w.ty; c.y=c.ty;
  c.behavior="wander"; c.behaviorUntil=0;
  if(fromActive){
    if(spriteEls[c.id]){ spriteEls[c.id].remove(); delete spriteEls[c.id]; }
    if(state.selected===c.id){ const here=catsIn(state.activeRoom); state.selected=here[0]?here[0].id:c.id; }
    renderNameStack(); renderHUD();
  }
  if(dest.id===state.activeRoom) syncSprites();
  saveGame();
}

/* ═══════════════════════ 21. FRAME LOOP ═══════════════════════ */
let fpsAcc=0, fpsN=0;
function frame(ts){
  /* Backgrounded tabs still get throttled rAF ticks in most browsers, but
     not reliably inside every wrapped WebView — skip the WebGL draws and
     particle sim ourselves rather than trust that, so a hidden café isn't
     quietly burning GPU/battery. */
  if(document.hidden){ lastFrame=ts; requestAnimationFrame(frame); return; }
  const dt=Math.min(0.05,(ts-lastFrame)/1000||0);
  lastFrame=ts;
  if(state){
    const t=now();
    View.camX+=(View.camTarget-View.camX)*Math.min(1,dt*9);
    for(const c of catsIn(state.activeRoom)){
      if(c.sleeping){ c.hop=0; continue; }
      if(c.freezeUntil&&t<c.freezeUntil){ c.hop=0; continue; }
      if(c.behavior==="idle"){ if(t>=c.behaviorUntil) assignBehavior(c); c.hop=0; maybeIdleAnim(c); continue; }
      const dx=c.tx-c.x, dy=c.ty-c.y, dist=Math.hypot(dx*2.2,dy);
      if(dist<0.02){ arrive(c); c.hop=0; }
      else {
        const sp=(0.085/Math.max(1,roomWidth(activeRoom())/2))*dt*(traitOf(c)==="athletic"?1.25:1);
        const step=Math.min(sp,dist);
        c.x+=dx/dist*step*2.2; c.y+=dy/dist*step;
        c.x=clamp(c.x,-0.12,1.12); c.y=clamp(c.y,CAT_BAND[0],CAT_BAND[1]);
        c.face=dx<0?-1:1; c.hop=(c.hop||0)+dt*12;
      }
    }
    // cats in other rooms drift too, just without rendering
    for(const c of state.cats){
      if(c.roomId===state.activeRoom||c.sleeping) continue;
      if(c.behavior==="idle"&&t>=c.behaviorUntil) assignBehavior(c);
      else if(c.behavior!=="idle"&&c.behavior!=="nap"){
        const dx=c.tx-c.x, dy=c.ty-c.y, d=Math.hypot(dx,dy);
        if(d<0.02) arrive(c); else { c.x+=dx/d*0.05*dt; c.y+=dy/d*0.05*dt; }
      }
    }
    positionSprites();
    if(roomNeedsRedraw(ts/1000)) drawRoom(ts/1000);
    ambientSpawn(dt);
    drawParticles(dt);
    // scroll rail
    const rail=document.getElementById("rail"), th=document.getElementById("railThumb");
    const frac=View.maxCam()>0?View.camX/View.maxCam():0;
    const vis=View.w/View.worldW;
    th.style.width=(vis*100)+"%";
    th.style.marginLeft=(frac*(1-vis)*100)+"%";
    rail.classList.toggle("hide",View.maxCam()<4);
  }
  requestAnimationFrame(frame);
}

/* ═══════════════════════ 22. STAT TICK ═══════════════════════ */
function tick(){
  if(!state) return;
  const dead=[], away=[], slot=daySlot();
  for(const room of state.rooms){
    const here=catsIn(room.id);
    const fx=roomFx(room);
    const avgL=roomLitterAvg(room);
    const poopN=room.poops.length;
    const cleanEnv=(poopN===0&&avgL>=60);
    const dirtyLitter=litterSpots(room).length?avgL<25:true;
    const badCouch=room.couch<45;
    const socialBoost=here.some(c=>traitOf(c)==="social")?1.15:1;
    for(const c of here){
      const isActive=room.id===state.activeRoom, f=isActive?1:0.45;
      if(c.sleeping){
        const bed=fx.bed>0?1:(fx.sleep>0?0.6:0);
        c.energy=clamp(c.energy+(5.5+bed*4.5));
        c.mood=clamp(c.mood+(0.5+bed*0.8)*MOOD_GAIN_SCALE*socialBoost);
        c.tummy=clamp(c.tummy-DECAY.tummySleep*f);
        if(cleanEnv) c.hygiene=clamp(c.hygiene+0.3);
        if(c.energy>=100){
          c.sleeping=false; c.behavior="wander"; c.behaviorUntil=0; c._sig=null;
          if(traitOf(c)==="sleepy") c.mood=clamp(c.mood+6);
          if(isActive) pushMsg(`${c.name} woke up refreshed ☀️`,false);
        }
      } else {
        const starving=c.tummy<=1;
        let tD=DECAY.tummy*(1-(fx.tummySlow||0));
        c.tummy=clamp(c.tummy-tD*f);
        let eD=DECAY.energy;
        if(fx.energy>0) c.energy=clamp(c.energy+fx.energy);
        if(starving) eD*=2;
        if(slot==="night") eD*=1.25;
        c.energy=clamp(c.energy-eD*f);
        if(cleanEnv) c.hygiene=clamp(c.hygiene+0.7*(isActive?1:0.5));
        else c.hygiene=clamp(c.hygiene-(DECAY.hygiene+poopN*0.03+(dirtyLitter?0.025:0))*f*(traitOf(c)==="vain"?0.7:1));
        let mD=DECAY.mood*(1-(fx.moodSlow||0));
        if(c.tummy<30||c.energy<25||c.hygiene<30) mD*=1.8;
        if(starving) mD*=3;
        if(badCouch||dirtyLitter||poopN>0) mD*=1.15;
        if(fx.mood>0) c.mood=clamp(c.mood+fx.mood*socialBoost);
        if(fx.perch>0) c.mood=clamp(c.mood+fx.perch*0.6);
        if(traitOf(c)==="vain"&&Object.keys(c.wear||{}).length) c.mood=clamp(c.mood+0.25);
        if(slot==="night"&&fx.light===0) mD*=1.2;
        c.mood=clamp(c.mood-mD*f);
        if(c.energy<=0){
          c.energy=0; c.sleeping=true; c.behavior="nap"; c._sig=null;
          pushMsg(`${c.name} collapsed asleep from exhaustion 😴`,false);
        }
      }
      // tummy-rub window
      if(!c.sleeping&&!c.sick&&c.mood>55&&now()>c.rubAt&&now()>c.rubUntil){ Rub.open(c); }
      if(now()>c.rubUntil&&Rub.cat===c) Rub.close();

      const wb=wellbeing(c);
      if(!c.sleeping&&!isBreeding(c)){
        let spew=0.0012;
        if(traitOf(c)==="accident") spew*=3;
        if(c.sick) spew*=2;
        if(Math.random()<spew) doSpew(c);
      }
      if(wb<28){ c.neglect=(c.neglect||0)+1;
        if(c.neglect>=3&&!c.sick){ c.sick=true; c._sig=null; pushMsg(`🤒 ${c.name} has gone off colour — look after them`,false); } }
      else if(wb>45) c.neglect=0;
      if(c.sick&&wb>55){ c.sick=false; c._sig=null; pushMsg(`💚 ${c.name} is feeling better`,false); }
      const inDanger=(c.tummy<=1)||(wb<18);
      if(inDanger){
        c.danger=(c.danger||0)+1;
        if(c.danger===2) pushMsg(`💔 ${c.name} is very weak — feed and clean them now`,true);
        else if(c.danger===6) pushMsg(`⚠️ ${c.name} IS FADING FAST! Help immediately`,true);
        if(c.danger>=10){ if(state.settings.awayMode) away.push(c.id); else dead.push(c.id); }
      } else if(wb>30&&c.tummy>10) c.danger=0;
      // slow, earned bond growth for cats kept genuinely well
      if(wb>78&&!c.sick) c.bond=clamp(c.bond+0.05);
    }
    // litter fills a touch as cats use it
    if(Math.random()<0.15) checkSynergies(room);
  }
  if(state.breeding){
    const f=state.cats.find(c=>c.id===state.breeding.f), m=state.cats.find(c=>c.id===state.breeding.m);
    if(f&&f.roomId===state.activeRoom&&Math.random()<0.6) fxAtCat(f,pick(["💗","💕","💞"]),"#F38BA6");
    if(m&&m.roomId===state.activeRoom&&Math.random()<0.6) fxAtCat(m,pick(["💗","💕","💞"]),"#F38BA6");
    if(!f||!m) state.breeding=null;
    else if(now()>=state.breeding.until) finishBreeding();
  }
  if(dead.length){
    const c=state.cats.find(x=>x.id===dead[0]);
    Audio.sfx("alarm");
    pushMsg(`💔 Sadly, ${c.name} has passed away. Please take good care of your kittens.`,true);
    if(state.breeding&&(dead.includes(state.breeding.f)||dead.includes(state.breeding.m))) state.breeding=null;
    state.cats=state.cats.filter(x=>!dead.includes(x.id));
    dead.forEach(id=>{ if(spriteEls[id]){ spriteEls[id].remove(); delete spriteEls[id]; } });
    if(!state.cats.find(x=>x.id===state.selected)){
      const h=catsIn(state.activeRoom); state.selected=h[0]?h[0].id:(state.cats[0]&&state.cats[0].id);
    }
    if(!state.cats.length){
      const nc=newCat("cream",{roomId:state.activeRoom});
      state.cats=[nc]; state.selected=nc.id;
      setTimeout(()=>pushMsg("A new kitten needs a loving home — take good care this time 🐱",false),2400);
    }
  }
  for(const id of away){
    const c=state.cats.find(x=>x.id===id);
    if(!c||c.away) continue;
    c.away=true; c.sleeping=false; c._sig=null;
    Audio.sfx("alarm");
    pushMsg(`🚪 ${c.name} has wandered off looking for food — play the Homeward Maze to bring them back`,true);
    if(spriteEls[id]){ spriteEls[id].remove(); delete spriteEls[id]; }
    if(state.selected===id){
      const h=catsIn(state.activeRoom);
      state.selected=h[0]?h[0].id:((state.cats.find(x=>!x.away)||{}).id);
    }
  }
  checkAchievements();
  renderAll(); saveGame();
  if(currentSheet==="shop"&&currentTab==="breed") refreshSheet();
}
/* trait pairs sharing a room occasionally throw a small event */
function checkSynergies(room){
  const here=catsIn(room.id);
  if(here.length<2) return;
  for(const s of SYNERGIES){
    const a=here.find(c=>traitOf(c)===s.a), b=here.find(c=>traitOf(c)===s.b&&c!==a);
    if(!a||!b) continue;
    if(Math.random()>0.18) continue;
    if(s.coins){ const g=earnCoins(s.coins); if(g) bumpWallet(); }
    if(s.mood){ a.mood=clamp(a.mood+s.mood*MOOD_GAIN_SCALE); b.mood=clamp(b.mood+s.mood*MOOD_GAIN_SCALE); }
    if(s.bond){ a.bond=clamp(a.bond+s.bond); b.bond=clamp(b.bond+s.bond); }
    pushMsg(`${s.n}: ${a.name} ${s.msg}`,false);
    if(room.id===state.activeRoom) fxAtCat(a,"✨","#FFD86B");
    break;
  }
}

/* ═══════════════════════ 23. ROOMS, ADOPTION, BREEDING ═══════════════════════ */
function switchRoom(id){
  state.activeRoom=id;
  for(const k in spriteEls){ spriteEls[k].remove(); delete spriteEls[k]; }
  const here=catsIn(id);
  if(here.length&&!here.find(c=>c.id===state.selected)) state.selected=here[0].id;
  View.camX=View.camTarget=0;
  View.recalcWorld();
  markRoomDirty();
  applyTheme();
  renderAll(); saveGame();
}
function buyRoom(kind){
  const k=ROOM_KINDS[kind];
  if(!spend(k.cost)) return;
  const r=newRoom(kind);
  state.rooms.push(r);
  Audio.sfx("cash"); toast(`${k.label} opened! 🚪`);

  if(!roomHasResidentSpace(r)&&(c.homeRoom!==roomId)){ toast(`${r.name} is full`); return; }

  const w=wanderSpot(); c.x=w.tx; c.y=w.ty; c.tx=c.x; c.ty=c.y;
  c.behavior="wander"; c.behaviorUntil=0;
  toast(`${c.name} moved to ${r.name}`);

  if(!hasRoomSpace()){ toast("No room left — buy another room first 🚪"); return; }
  if(!spend(sc.cost)) return;
  const home=state.rooms.find(r=>roomHasResidentSpace(r));
  const c=newCat(sc.breed,{name:sc.name,sex:sc.sex,roomId:home.id,trait:sc.trait});
  state.cats.push(c); state.adopted++;
  state.seen[sc.breed]=true;
  state.shelter=state.shelter.filter(s=>s.sid!==sid);
  if(state.shelter.length<3) state.shelter.push(makeShelterCat());

  pushMsg(`${c.name} has come home! 🏠`,false);
  if(c.roomId!==state.activeRoom) switchRoom(c.roomId);

}

  if(!selF||!selM){ toast("Pick one female and one male 💞"); return; }
  if(!hasRoomSpace()){ toast("No room for a kitten — buy another room 🚪"); return; }
  const f=state.cats.find(c=>c.id===selF), m=state.cats.find(c=>c.id===selM);
  if(!f||!m||!canBreed(f)||!canBreed(m)){ toast("Both need to be well fed, rested and bonded 💞"); return; }
  state.breeding={f:f.id,m:m.id,until:now()+BREED_TIME};
  f.loveUntil=now()+BREED_TIME; m.loveUntil=now()+BREED_TIME;

  const f=state.cats.find(c=>c.id===state.breeding.f), m=state.cats.find(c=>c.id===state.breeding.m);

  if(!f||!m) return;

  const home=state.rooms.find(r=>roomHasResidentSpace(r));

  const trait=Math.random()<0.45?f.trait:(Math.random()<0.7?m.trait:pick(TRAIT_KEYS));
  const kit=newCat(breed,{roomId:home.id,trait});
  state.cats.push(kit); state.seen[breed]=true; state.stats.bred++;

  Audio.sfx("fanfare"); confettiRain(110);

/* ═══════════════════════ 24. OFFLINE PROGRESS ═══════════════════════ */
function applyOfflineDecay(){
  if(!state||!state.lastSeen) return;
  const elapsed=Math.max(0,(now()-state.lastSeen)/1000);
  if(elapsed<30) return;
  const sec=Math.min(elapsed,60*60*48);
  const hours=elapsed/3600;
  const tR=DECAY.tummy/(TICK_MS/1000), eR=DECAY.energy/(TICK_MS/1000),
        mR=DECAY.mood/(TICK_MS/1000), hR=DECAY.hygiene/(TICK_MS/1000);
  let coins=0;
  for(const c of state.cats){
    const happy=c.tummy>80&&c.energy>80&&c.mood>80&&c.hygiene>80&&!c.sick;
    if(happy) coins+=Math.floor(hours);
    if(traitOf(c)==="helpful"&&!c.sick&&c.mood>40) coins+=Math.floor(hours);
    if(c.sleeping){
      c.energy=clamp(c.energy+sec*0.006);
      c.tummy=clamp(c.tummy-sec*tR*0.5);
    } else {
      c.tummy=clamp(c.tummy-sec*tR);
      c.energy=clamp(c.energy-sec*eR);
      c.mood=clamp(c.mood-sec*mR);
      c.hygiene=clamp(c.hygiene-sec*hR);
    }
    c.rubAt=Math.max(c.rubAt,now()+rnd(60000,RUB_MAX_GAP));
    c._sig=null;
  }
  if(coins>0){ state.pts+=coins; setTimeout(()=>pushMsg(`Your happy cats earned ${coins} coins while you were out 🪙`,false),1400); }
  const hrs=Math.floor(elapsed/3600);
  if(hrs>=1) setTimeout(()=>pushMsg(`Welcome back! Your cats waited ${hrs}h — go say g'day 🐾`,false),900);
}

/* lazy thumbnails: only paint what's actually on screen */
let thumbObserver=null;
function hydrateThumbs(){
  const nodes=document.querySelectorAll("[data-thumb]:not([data-done])");
  if(!nodes.length) return;
  if(typeof IntersectionObserver==="undefined"){          // very old browsers: just paint them
    nodes.forEach(el=>{ const it=ITEM_BY_ID[el.dataset.thumb];
      if(it) el.appendChild(thumbFor(it,96).cloneNode(true)); el.dataset.done="1"; });
    return;
  }
  if(!thumbObserver){
    thumbObserver=new IntersectionObserver(es=>{
      for(const e of es){
        if(!e.isIntersecting) continue;
        const el=e.target, it=ITEM_BY_ID[el.dataset.thumb];
        if(it){ el.appendChild(thumbFor(it,96).cloneNode(true)); }
        el.dataset.done="1"; thumbObserver.unobserve(el);
      }
    },{root:document.getElementById("sheetBody"),rootMargin:"180px"});
  }
  nodes.forEach(n=>thumbObserver.observe(n));
}

     <div class="progWrap"><div class="pt"><span>🔥 ${state.streak||0} day${state.streak===1?"":"s"}</span>

/* ── achievements ── */
achievements(){

    const done=!!state.ach[a.id];
    let v=0; try{ v=a.get(state)||0; }catch(e){}

function bindSheet(){
  const root=document.getElementById("sheet");
  const on=(sel,fn,ev)=>root.querySelectorAll(sel).forEach(el=>el.addEventListener(ev||"click",fn));

  on("[data-tab]",e=>{ currentTab=e.currentTarget.dataset.tab; shopPage=1; refreshSheet(); });
  on("[data-filter]",e=>{ shopFilter=e.currentTarget.dataset.filter; shopPage=1; refreshSheet(); });
  const q=root.querySelector("#shopQ");
  if(q) q.addEventListener("input",()=>{ shopSearch=q.value; shopPage=1;
    const pos=q.selectionStart; refreshSheet();
    const nq=document.getElementById("shopQ"); if(nq){ nq.focus(); try{ nq.setSelectionRange(pos,pos); }catch(_){} } });
  const more=root.querySelector("#moreBtn");
  if(more) more.addEventListener("click",()=>{ shopPage++; refreshSheet(); });

  on("[data-wish]",e=>{ e.stopPropagation();
    const id=e.currentTarget.dataset.wish;
    state.wish=state.wish||{};
    if(state.wish[id]) delete state.wish[id]; else state.wish[id]=1;
    Audio.sfx("click"); saveGame(); refreshSheet(); });
  on("[data-item]",e=>onItemTap(e.currentTarget.dataset.item));
  on("[data-place]",e=>{ const id=e.currentTarget.dataset.place;
    Deco.place(id); Deco.toggle(true); closeSheet(); });
  on("[data-feed]",e=>{ const f=FOODS.find(x=>x.id===e.currentTarget.dataset.feed); if(f) feed(f); });
  on("[data-toy]",e=>{ const t=TOYS.find(x=>x.id===e.currentTarget.dataset.toy); if(t) playToy(t); });
  on("[data-buytoy]",e=>{ const t=TOYS.find(x=>x.id===e.currentTarget.dataset.buytoy); if(!t) return;
    if(!spend(t.cost)) return; state.toys.push(t.id); state.owned["t_"+t.id]=1;
    Audio.sfx("coin"); toast(`Bought ${t.n} ${t.e}`); checkAchievements(); renderHUD(); saveGame(); refreshSheet(); });
  on("[data-game]",e=>{ closeSheet(); MG.start(e.currentTarget.dataset.game); });
  on("[data-room]",e=>buyRoom(e.currentTarget.dataset.room));
  on("[data-goroom]",e=>{ switchRoom(e.currentTarget.dataset.goroom); refreshSheet(); });
  on("[data-adopt]",e=>adoptFromShelter(e.currentTarget.dataset.adopt));
  on("[data-self]",e=>{ selF=e.currentTarget.dataset.self; refreshSheet(); });
  on("[data-selm]",e=>{ selM=e.currentTarget.dataset.selm; refreshSheet(); });
  const bb=root.querySelector("#breedBtn"); if(bb) bb.addEventListener("click",startBreeding);
  on("[data-theme]",e=>applyThemePreset(e.currentTarget.dataset.theme));
  on("[data-move]",e=>{ const [c,r]=e.currentTarget.dataset.move.split("|"); moveCat(c,r); });
  on("[data-trick]",e=>doTrick(selectedCat(),e.currentTarget.dataset.trick));
  on("[data-unwear]",e=>{ const c=selectedCat(); delete c.wear[e.currentTarget.dataset.unwear];
    c._sig=null; Audio.sfx("click"); syncSprites(); saveGame(); refreshSheet(); });
  on("[data-quest]",e=>claimQuest(state.quests[+e.currentTarget.dataset.quest]));
  on("[data-open]",e=>openSheet(e.currentTarget.dataset.open));
  on("[data-decorate]",()=>{ closeSheet(); Deco.toggle(true); toast("Decorate mode — drag things about 🎨"); });
  on("[data-photo]",()=>{ closeSheet(); setTimeout(takePhoto,340); });
  on("[data-clean]",e=>{ cleanLitterAt(activeRoom(),e.currentTarget.dataset.clean); closeSheet(); });
  on("[data-fill]",e=>fillFeederAt(activeRoom(),e.currentTarget.dataset.fill));
  on("[data-upfeeder]",e=>upgradeFeederAt(activeRoom(),e.currentTarget.dataset.upfeeder));
  on("[data-flip]",e=>{ const p=findPlaced(e.currentTarget.dataset.flip); if(p){ p.flip=(p.flip||1)*-1; saveGame(); } });
  on("[data-nudge]",e=>{ const [u,dir]=e.currentTarget.dataset.nudge.split("|");
    const p=findPlaced(u); if(!p) return;
    const it=ITEM_BY_ID[p.item];
    const lo=it.zone==="wall"?0.06:HORIZON+0.02, hi=it.zone==="wall"?HORIZON-0.04:0.97;
    p.y=clamp(p.y+(dir==="up"?-0.03:0.03),lo,hi); saveGame(); });
  on("[data-storeitem]",e=>{ const p=findPlaced(e.currentTarget.dataset.storeitem); if(p) Deco.store(p); closeSheet(); });
  on("[data-toggle]",e=>{
    const k=e.currentTarget.dataset.toggle;
    state.settings[k]=!state.settings[k];
    if(k==="music") Audio.setMusic(state.settings[k]);
    if(k==="sfx") Audio.setSfx(state.settings[k]);
    if(k==="realMusic") Audio.setRealMusic(state.settings[k]);
    if(k==="particles"&&!state.settings[k]) Particles.clear();
    saveGame(); refreshSheet();
  });
  on("[data-vol]",e=>{
    const k=e.currentTarget.dataset.vol, v=+e.currentTarget.value/100;
    state.settings[k+"Vol"]=v;
    if(k==="music") Audio.setMusicVol(v); else Audio.setSfxVol(v);

  if(dc) dc.addEventListener("change",()=>{ selectedCat().closeDoor=dc.checked; saveGame(); });
  const reset=root.querySelector("#resetBtn");
  if(reset) reset.addEventListener("click",async()=>{
    if(!reset.dataset.armed){ reset.dataset.armed="1"; reset.textContent="Tap again to wipe everything"; return; }
    await Store.set(SAVE_KEY,"");
    location.reload();
  });
}
function findPlaced(u){ return activeRoom().placed.find(p=>p.u===u); }

/* buying / using a shop card */
function onItemTap(id){
  const it=ITEM_BY_ID[id]; if(!it) return;
  if(!owns(id)){
    if(it.kind==="bundle"){
      if(!spend(it.price)) return;
      it.contents.forEach(x=>{ state.owned[x]=1; });
      state.owned[id]=1;
      Audio.sfx("cash"); confettiRain(70);
      toast(`${it.name} unlocked — ${it.contents.length} pieces added to storage 🎁`);
    } else {
      if(!spend(it.price)) return;
      state.owned[id]=1;
      Audio.sfx("coin");
      toast(`Bought ${it.name}`);
      if(it.kind==="toy"&&!state.toys.includes(it.toy.id)) state.toys.push(it.toy.id);
    }
    bumpWallet(); checkAchievements(); renderHUD(); saveGame(); refreshSheet();
    return;
  }
  // owned → use it
  const r=activeRoom(), c=selectedCat();
  if(it.kind==="wallpaper"){ r.wp=id; applyTheme(); markRoomDirty(); Audio.sfx("click"); toast(`${it.name} up on the walls`); }
  else if(it.kind==="floor"){ r.fl=id; applyTheme(); markRoomDirty(); Audio.sfx("click"); toast(`${it.name} down on the floor`); }
  else if(it.kind==="costume"){
    c.wear=c.wear||{};
    if(c.wear[it.slot]===id) delete c.wear[it.slot]; else c.wear[it.slot]=id;
    c._sig=null; Audio.sfx("mew"); syncSprites();
  }
  else if(it.kind==="furni"){ Deco.place(id); Deco.toggle(true); closeSheet(); return; }
  else if(it.kind==="toy"){ playToy(it.toy); return; }
  saveGame(); refreshSheet();
}
function applyThemePreset(id){
  const t=ROOM_THEMES.find(x=>x.id===id); if(!t) return;
  const locked=t.unlock&&!state.ach[t.unlock]&&!owns("theme_"+id);
  if(locked){ toast("Unlock this by completing its achievement 🔒"); return; }
  if(t.price>0&&!owns("theme_"+id)){ if(!spend(t.price)) return; state.owned["theme_"+id]=1; Audio.sfx("cash"); }
  const r=activeRoom();
  r.theme=id; r.wp=t.wp; r.fl=t.fl;
  state.owned[t.wp]=1; state.owned[t.fl]=1;
  applyTheme(); markRoomDirty();
  toast(`${t.n} applied ✨`);
  confettiRain(35);
  saveGame(); refreshSheet();
}
function applyTheme(){
  const r=activeRoom();
  const t=ROOM_THEMES.find(x=>x.id===r.theme);
  Audio.setScale(t?t.scale:"cosy");
  const wp=(ITEM_BY_ID[r.wp]&&ITEM_BY_ID[r.wp].data)||WALLPAPERS[0];
  document.documentElement.style.setProperty("--wall-1",wp.a);
  document.documentElement.style.setProperty("--wall-2",wp.b);
  const dark=daySlot()==="night";
  document.body.classList.toggle("night", dark && state.settings.dayNight);
  document.querySelector('meta[name=theme-color]').setAttribute("content", dark?"#2B2A46":"#FBF3E7");
}

/* a cat's favourite game, repaired if the saved id is stale */
function favGameOf(c){
  let g=MINIGAMES.find(x=>x.id===c.favGame);
  if(!g){ g=pick(MINIGAMES); c.favGame=g.id; }
  return g;
}
/* Games that exist outside the normal Games-tab rotation — not tied to a
   cat's mood or cooldown, triggered instead by something happening in the
   world (right now: a cat going missing). Kept separate from MINIGAMES so
   they never show up as a purchasable/idle activity in the Games sheet. */
const EXTRA_GAMES={
  homeward:{id:"homeward", n:"Homeward Maze", emoji:"🏠", time:50,
    d:"Drag to steer — guide them home through the maze before the trail goes cold.", scale:[1,1,1]}
};
function startHomewardMaze(cat){
  if(!cat||!cat.away) return;
  MG.start("homeward",cat);
}
const MG={
  cur:null, g:null, ctx:null, raf:0, last:0, running:false, score:0, goal:0, timeLeft:0, cat:null,
  start(id,forcedCat){
    const def=MINIGAMES.find(x=>x.id===id)||EXTRA_GAMES[id]; if(!def) return;
    const c=forcedCat||selectedCat(); if(!c) return;
    if(c.sleeping){ toast(`${c.name} is fast asleep 😴`); return; }
    this.cur=def; this.cat=c;
    const diff=stageIndex(c);
    this.goal=def.scale[diff];
    this.score=0; this.timeLeft=def.time||24;
    const cv=document.getElementById("mgCanvas");
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const w=cv.clientWidth||320, h=cv.clientHeight||240;
    cv.width=w*dpr; cv.height=h*dpr;
    this.ctx=cv.getContext("2d"); this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.W=w; this.H=h;
    this.g=MG_BUILD[id](this,diff);
    document.getElementById("mgTitle").textContent=`${def.emoji} ${def.n}`;
    document.getElementById("mgSub").textContent=def.d;
    document.getElementById("mgOver").classList.remove("show");
    document.getElementById("mg").classList.add("open");
    document.getElementById("mgAction").textContent="Go!";
    document.getElementById("mgAction").disabled=false;
    this.running=false;
    this.draw();
  },
  go(){
    if(this.running) return;
    this.running=true; this.last=performance.now();
    document.getElementById("mgAction").disabled=true;
    document.getElementById("mgAction").textContent="Playing…";
    Audio.sfx("whoosh");
    cancelAnimationFrame(this.raf);
    this.raf=requestAnimationFrame(t=>this.loop(t));
  },
  loop(t){
    if(!this.running) return;
    const dt=Math.min(0.05,(t-this.last)/1000); this.last=t;
    this.timeLeft-=dt;
    if(this.g.update) this.g.update(dt);
    this.draw();
    if(this.score>=this.goal){ this.finish(true); return; }
    if(this.timeLeft<=0){ this.finish(false); return; }
    this.raf=requestAnimationFrame(x=>this.loop(x));
  },
  draw(){
    const g=this.ctx, W=this.W, H=this.H;
    g.clearRect(0,0,W,H);
    const dark=document.body.classList.contains("night");
    g.fillStyle=dark?"#2E2C4A":"#FFF7EC"; g.fillRect(0,0,W,H);
    if(this.g.draw) this.g.draw(g,W,H);
    // hud
    g.fillStyle=dark?"rgba(255,255,255,.86)":"rgba(63,49,40,.86)";
    g.font="800 14px Nunito, system-ui, sans-serif"; g.textAlign="left";
    g.fillText(`${this.score} / ${this.goal}`,12,22);
    g.textAlign="right";
    g.fillText(`${Math.max(0,this.timeLeft).toFixed(1)}s`,W-12,22);
    g.textAlign="left";
    const p=clamp(this.score/this.goal,0,1);
    g.fillStyle=dark?"rgba(255,255,255,.16)":"rgba(63,49,40,.12)";
    g.fillRect(12,28,W-24,6);
    g.fillStyle="#6FCF97"; g.fillRect(12,28,(W-24)*p,6);
  },
  hit(n){ this.score+=(n||1); Audio.sfx("pop"); },
  miss(){ Audio.sfx("fail"); this.timeLeft=Math.max(0.1,this.timeLeft-1.2); },
  finish(win){
    this.running=false; cancelAnimationFrame(this.raf);
    const c=this.cat, def=this.cur;
    if(def.id==="homeward"){ this.finishHomeward(win); return; }
    c.lastGameAt=c.lastGameAt||{};
    c.lastGameAt[def.id]=now();
    const fav=c.favGame===def.id;
    let coins=0, moodUp=0, bondUp=0;
    if(win){
      state.stats.games++;
      coins=Math.round((10+this.goal*1.6)*(fav?1.6:1));
      moodUp=(fav?16:11)*MOOD_GAIN_SCALE*1.6;
      bondUp=BOND_PER_GAME*(fav?1.5:1);
      earnCoins(coins,true);
      c.mood=clamp(c.mood+moodUp);
      c.bond=clamp(c.bond+bondUp);
      c.energy=clamp(c.energy-6);
      if(!c.sick) c.growth+=8;
      Audio.sfx("fanfare"); confettiRain(90);
      checkTrickUnlock(c);
    } else {
      coins=Math.round(this.score*1.2);
      if(coins) earnCoins(coins,true);
      c.mood=clamp(c.mood+3*MOOD_GAIN_SCALE);
      c.bond=clamp(c.bond+0.4);
      Audio.sfx("fail");
    }
    const ov=document.getElementById("mgOver");
    document.getElementById("mgOverT").textContent=win?"Ripper! 🎉":"Good try 🐾";
    document.getElementById("mgOverS").innerHTML=win
      ? `${esc(c.name)} loved that${fav?" — it's their favourite!":""}<br>+${coins} coins · +${bondUp.toFixed(1)} bond`
      : `Got ${this.score} of ${this.goal}.<br>${coins?`+${coins} coins for the effort.`:"Have another go in a bit."}`;
    ov.classList.add("show");
    document.getElementById("mgAction").disabled=false;
    document.getElementById("mgAction").textContent="Play again";
    touchStreak(); checkAchievements(); renderAll(); saveGame();
  },
  /* winning brings the cat straight home with enough tummy/energy to be
     safe again; losing just means the trail's gone cold for now — no
     extra penalty, so this never feels like a punishing time-attack. */
  finishHomeward(win){
    const c=this.cat, ov=document.getElementById("mgOver");
    if(win){
      c.away=false; c.danger=0; c.neglect=0; c.sick=false; c._sig=null;
      c.tummy=clamp(Math.max(c.tummy,35)); c.energy=clamp(Math.max(c.energy,35));
      c.mood=clamp(c.mood+8);
      c.behavior="wander"; c.behaviorUntil=0;
      c.tx=c.x=clamp(rnd(0.35,0.65),0.05,0.95);
      c.ty=c.y=rnd(CAT_BAND[0],CAT_BAND[1]);
      Audio.sfx("fanfare"); confettiRain(90);
      pushMsg(`🏠 ${c.name} is home safe! Keep an eye on their tummy so they don't wander off again.`,false);
      document.getElementById("mgOverT").textContent="Welcome home! 🎉";
      document.getElementById("mgOverS").innerHTML=`${esc(c.name)} is back safe and sound.`;
    } else {
      Audio.sfx("fail");
      document.getElementById("mgOverT").textContent="So close 🐾";
      document.getElementById("mgOverS").innerHTML=`${esc(c.name)} is still out there — have another go whenever you're ready.`;
    }
    ov.classList.add("show");
    document.getElementById("mgAction").disabled=false;
    document.getElementById("mgAction").textContent=win?"Yay! 🎉":"Try again";
    checkAchievements(); renderAll(); saveGame();
  },
  close(){
    this.running=false; cancelAnimationFrame(this.raf);
    document.getElementById("mg").classList.remove("open");
    this.g=null; this.cur=null;
  }
};
const MG_BUILD={
  /* tap the feather; it drifts on a wandering path and jumps when hit */
  feather(M,diff){
    const sp=[110,165,225][diff];
    let x=M.W/2, y=M.H/2, a=Math.random()*6.28, trail=[];
    return {
      update(dt){
        a+=rnd(-2.2,2.2)*dt*2;
        x+=Math.cos(a)*sp*dt; y+=Math.sin(a)*sp*dt*0.8;
        if(x<26||x>M.W-26){ a=Math.PI-a; x=clamp(x,26,M.W-26); }
        if(y<50||y>M.H-26){ a=-a; y=clamp(y,50,M.H-26); }
        trail.push([x,y]); if(trail.length>14) trail.shift();
      },
      draw(g){
        g.strokeStyle="rgba(240,180,120,.35)"; g.lineWidth=3; g.beginPath();
        trail.forEach(([tx,ty],i)=>i?g.lineTo(tx,ty):g.moveTo(tx,ty)); g.stroke();
        g.save(); g.translate(x,y); g.rotate(a);
        g.fillStyle="#F0A03D"; g.beginPath(); g.ellipse(0,0,20,9,0,0,6.283); g.fill();
        g.fillStyle="#FFE3B8"; g.beginPath(); g.ellipse(4,0,12,5,0,0,6.283); g.fill();
        g.strokeStyle="#B9773A"; g.lineWidth=2; g.beginPath(); g.moveTo(-20,0); g.lineTo(-32,4); g.stroke();
        g.restore();
      },
      down(px,py){
        if(Math.hypot(px-x,py-y)<32){ M.hit(); x=rnd(30,M.W-30); y=rnd(55,M.H-30); a=Math.random()*6.28; trail=[]; }
        else M.miss();
      }
    };
  },
  /* steer a rolling yarn ball down through gaps in the walls */
  yarn(M,diff){
    const gap=[110,86,68][diff], speed=[95,130,170][diff];
    let bx=M.W/2, walls=[], spawn=0, rot=0;
    return {
      update(dt){
        rot+=dt*6; spawn-=dt;
        if(spawn<=0){ spawn=1.15; walls.push({y:-20,gx:rnd(gap/2+14,M.W-gap/2-14),done:false}); }
        for(const w of walls){
          w.y+=speed*dt;
          if(!w.done&&w.y>M.H-56){
            w.done=true;
            if(Math.abs(bx-w.gx)<gap/2-8) M.hit(); else M.miss();
          }
        }
        walls=walls.filter(w=>w.y<M.H+30);
      },
      draw(g){
        for(const w of walls){
          g.fillStyle="#C9A88A";
          g.fillRect(0,w.y,w.gx-gap/2,16);
          g.fillRect(w.gx+gap/2,w.y,M.W-(w.gx+gap/2),16);
        }
        const by=M.H-40;
        g.save(); g.translate(bx,by); g.rotate(rot);
        g.fillStyle="#F38BA6"; g.beginPath(); g.arc(0,0,17,0,6.283); g.fill();
        g.strokeStyle="#C96B85"; g.lineWidth=2;
        for(let i=0;i<3;i++){ g.beginPath(); g.ellipse(0,0,17,7+i*4,i*1.1,0,6.283); g.stroke(); }
        g.restore();
      },
      move(px){ bx=clamp(px,20,M.W-20); },
      down(px){ bx=clamp(px,20,M.W-20); }
    };
  },
  /* timing bar — stop the marker in the blue band */
  fishing(M,diff){
    const band=[64,46,32][diff], speed=[210,280,360][diff];
    let x=20, dir=1, zone=rnd(40,M.W-40-band), flash=0, fish=[];
    return {
      update(dt){
        x+=dir*speed*dt;
        if(x>M.W-14){ x=M.W-14; dir=-1; } if(x<14){ x=14; dir=1; }
        flash=Math.max(0,flash-dt);
        for(const f of fish){ f.y-=dt*70; f.a-=dt*0.8; }
        fish=fish.filter(f=>f.a>0);
      },
      draw(g,W,H){
        g.fillStyle="#BFE3F2"; g.fillRect(0,H*0.42,W,H*0.58);
        for(let i=0;i<4;i++){ g.fillStyle="rgba(255,255,255,.28)";
          g.fillRect(0,H*0.46+i*16+Math.sin(performance.now()/600+i)*3,W,4); }
        for(const f of fish){ g.globalAlpha=f.a; g.font="26px serif"; g.textAlign="center"; g.fillText("🐟",f.x,f.y); g.globalAlpha=1; }
        const by=H*0.24;
        g.fillStyle="rgba(63,49,40,.12)"; g.fillRect(14,by,W-28,26);
        g.fillStyle=flash>0?"#6FCF97":"#5FA8D3"; g.fillRect(zone,by,band,26);
        g.fillStyle="#3F3128"; g.fillRect(x-3,by-8,6,42);
        g.textAlign="center"; g.font="800 12px Nunito, sans-serif"; g.fillStyle="rgba(63,49,40,.7)";
        g.fillText("tap in the blue",W/2,by+58);
      },
      down(){
        if(x>=zone&&x<=zone+band){ M.hit(); flash=0.3; Audio.sfx("splash");
          fish.push({x:x,y:M.H*0.7,a:1}); zone=rnd(20,M.W-20-band); }
        else M.miss();
      }
    };
  },
  /* pounce on the dot before it moves on */
  laser(M,diff){
    const life=[1.15,0.85,0.62][diff];
    let x=M.W/2,y=M.H/2,t=life,r=20,pulse=0;
    const move=()=>{ x=rnd(30,M.W-30); y=rnd(56,M.H-30); t=life; pulse=1; };
    return {
      update(dt){ t-=dt; pulse=Math.max(0,pulse-dt*3); if(t<=0){ M.miss(); move(); } },
      draw(g){
        g.fillStyle="rgba(230,70,70,.18)"; g.beginPath(); g.arc(x,y,r+10+pulse*14,0,6.283); g.fill();
        g.fillStyle="#E24A4A"; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
        g.fillStyle="rgba(255,255,255,.6)"; g.beginPath(); g.arc(x-5,y-5,5,0,6.283); g.fill();
        g.strokeStyle="rgba(226,74,74,.5)"; g.lineWidth=3; g.beginPath();
        g.arc(x,y,r+6,-1.57,-1.57+6.283*(t/life)); g.stroke();
      },
      down(px,py){ if(Math.hypot(px-x,py-y)<r+14){ M.hit(); move(); } else M.miss(); }
    };
  },
  /* notes fall to the line — tap as each one lands */
  purr(M,diff){
    const speed=[140,185,235][diff], every=[0.85,0.7,0.55][diff];
    let notes=[], spawn=0.4;
    const LINE=()=>M.H-52;
    return {
      update(dt){
        spawn-=dt;
        if(spawn<=0){ spawn=every; notes.push({x:rnd(40,M.W-40),y:-16,hit:false}); }
        for(const n of notes){
          n.y+=speed*dt;
          if(!n.hit&&n.y>LINE()+34){ n.hit="miss"; M.miss(); }
        }
        notes=notes.filter(n=>n.y<M.H+40);
      },
      draw(g,W,H){
        const L=LINE();
        g.strokeStyle="rgba(163,120,209,.55)"; g.lineWidth=4;
        g.beginPath(); g.moveTo(0,L); g.lineTo(W,L); g.stroke();
        g.fillStyle="rgba(163,120,209,.14)"; g.fillRect(0,L-22,W,44);
        for(const n of notes){
          g.globalAlpha=n.hit==="miss"?0.25:1;
          g.font="28px serif"; g.textAlign="center";
          g.fillText(n.hit===true?"💗":"🎵",n.x,n.y);
          g.globalAlpha=1;
        }
      },
      down(px,py){
        const L=LINE();
        let best=null,bd=1e9;
        for(const n of notes){ if(n.hit) continue; const d=Math.abs(n.y-L); if(d<bd){ bd=d; best=n; } }
        if(best&&bd<34){ best.hit=true; M.hit(); Audio.sfx("combo",1.1+Math.random()*0.3); }
        else M.miss();
      }
    };
  },
  /* a real grid maze — drag to steer a step at a time toward the house.
     Generated fresh each attempt with a randomised depth-first carve, so
     it's never the same run twice. */
  homeward(M,diff){
    const n=[6,8,10][diff]||8;
    const top=40, pad=10;
    const size=Math.min(M.W-pad*2,(M.H-top-pad))/n;
    const ox=(M.W-size*n)/2, oy=top+(M.H-top-size*n)/2;
    // walls[r][c] = {N,E,S,W} true = wall present
    const walls=Array.from({length:n},()=>Array.from({length:n},()=>({N:true,E:true,S:true,W:true})));
    const visited=Array.from({length:n},()=>Array(n).fill(false));
    (function carve(r,c){
      visited[r][c]=true;
      const dirs=[["N",-1,0,"S"],["E",0,1,"W"],["S",1,0,"N"],["W",0,-1,"E"]];
      for(let i=dirs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [dirs[i],dirs[j]]=[dirs[j],dirs[i]]; }
      for(const [d,dr,dc,opp] of dirs){
        const nr=r+dr, nc=c+dc;
        if(nr<0||nr>=n||nc<0||nc>=n||visited[nr][nc]) continue;
        walls[r][c][d]=false; walls[nr][nc][opp]=false;
        carve(nr,nc);
      }
    })(0,0);
    let cr=0, cc=0;                       // current cell
    let px=ox+size/2, py=oy+size/2;       // pixel position (mid-cell when settled)
    let moving=null;                      // {tr,tc,t}
    let desired=null, refX=0, refY=0, haveRef=false;
    const cellPx=(r,c)=>[ox+c*size+size/2, oy+r*size+size/2];
    const SPEED=1/0.16;                   // cells per second while animating
    function tryStep(dir){
      if(moving) return;
      const w=walls[cr][cc];
      if(w[dir]) { M.miss(); return; }
      const d={N:[-1,0],E:[0,1],S:[1,0],W:[0,-1]}[dir];
      const tr=cr+d[0], tc=cc+d[1];
      if(tr<0||tr>=n||tc<0||tc>=n) return;
      moving={tr,tc,t:0,fr:cr,fc:cc};
    }
    return {
      update(dt){
        if(moving){
          moving.t=Math.min(1,moving.t+dt*SPEED);
          const [fx,fy]=cellPx(moving.fr,moving.fc), [tx,ty]=cellPx(moving.tr,moving.tc);
          px=lerp(fx,tx,moving.t); py=lerp(fy,ty,moving.t);
          if(moving.t>=1){
            cr=moving.tr; cc=moving.tc; moving=null;
            if(cr===n-1&&cc===n-1){ M.score=M.goal; Audio.sfx("pop"); }
            else if(desired) tryStep(desired);
          }
        } else if(desired) tryStep(desired);
      },
      draw(g){
        g.strokeStyle="rgba(90,70,54,.55)"; g.lineWidth=3; g.lineCap="round";
        g.beginPath();
        for(let r=0;r<n;r++) for(let c=0;c<n;c++){
          const x=ox+c*size, y=oy+r*size, w=walls[r][c];
          if(w.N){ g.moveTo(x,y); g.lineTo(x+size,y); }
          if(w.W){ g.moveTo(x,y); g.lineTo(x,y+size); }
          if(r===n-1&&w.S){ g.moveTo(x,y+size); g.lineTo(x+size,y+size); }
          if(c===n-1&&w.E){ g.moveTo(x+size,y); g.lineTo(x+size,y+size); }
        }
        g.stroke();
        const [hx,hy]=cellPx(n-1,n-1);
        g.font=`${Math.min(size*0.7,28)}px serif`; g.textAlign="center"; g.textBaseline="middle";
        g.fillText("🏠",hx,hy);
        g.font=`${Math.min(size*0.62,24)}px serif`;
        g.fillText("🐾",px,py);
        g.textBaseline="alphabetic";
      },
      down(x,y){ haveRef=true; refX=x; refY=y; },
      move(x,y){
        if(!haveRef) return;
        const dx=x-refX, dy=y-refY;
        if(Math.hypot(dx,dy)<size*0.4) return;
        desired=Math.abs(dx)>Math.abs(dy)?(dx>0?"E":"W"):(dy>0?"S":"N");
        refX=x; refY=y;
        tryStep(desired);
      }
    };
  }
};
function bindMinigame(){
  const cv=document.getElementById("mgCanvas");
  const loc=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  let down=false;
  cv.addEventListener("pointerdown",e=>{
    e.preventDefault(); down=true;
    if(!MG.running||!MG.g) return;
    const [x,y]=loc(e); if(MG.g.down) MG.g.down(x,y);
  });
  cv.addEventListener("pointermove",e=>{
    if(!down||!MG.running||!MG.g||!MG.g.move) return;
    const [x,y]=loc(e); MG.g.move(x,y);
  });
  addEventListener("pointerup",()=>{ down=false; });
  document.getElementById("mgAction").addEventListener("click",()=>{
    if(document.getElementById("mgOver").classList.contains("show")) MG.start(MG.cur.id,MG.cat);
    else MG.go();
  });
  document.getElementById("mgQuit").addEventListener("click",()=>MG.close());
  document.getElementById("mgClose").addEventListener("click",()=>MG.close());
}

async function takePhoto(){
  toast("Say cheese… 📸");
  Audio.sfx("shutter");
  const st=View.stage, rect=st.getBoundingClientRect();
  const W=Math.round(rect.width), H=Math.round(rect.height);
  const out=document.createElement("canvas");
  const dpr=Math.min(2,window.devicePixelRatio||1);
  out.width=W*dpr; out.height=(H+56)*dpr;
  const g=out.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=document.body.classList.contains("night")?"#2B2A46":"#FBF3E7";
  g.fillRect(0,0,W,H+56);
  try{ g.drawImage(document.getElementById("glRoom"),0,0,W,H); }catch(e){}
  // cats are DOM SVG — serialise each and draw it in place
  const sprites=[...document.querySelectorAll(".catSprite")];
  await Promise.all(sprites.map(sp=>new Promise(res=>{
    const svg=sp.querySelector("svg"); if(!svg) return res();
    const r=sp.getBoundingClientRect();
    const clone=svg.cloneNode(true);
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    const src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(clone));
    const img=new Image();
    img.onload=()=>{ g.drawImage(img,r.left-rect.left,r.top-rect.top,r.width,r.height); res(); };
    img.onerror=()=>res();
    img.src=src;
  })));
  try{ g.drawImage(document.getElementById("glFx"),0,0,W,H); }catch(e){}
  const r=activeRoom();
  const names=catsIn(r.id).map(c=>c.name).join(", ")||"an empty room";
  g.fillStyle=document.body.classList.contains("night")?"rgba(255,255,255,.9)":"#3F3128";
  g.font="800 16px Nunito, system-ui, sans-serif"; g.textAlign="left";
  g.fillText("🐾 Kitten Café — "+r.name,14,H+24);
  g.font="600 12px Nunito, system-ui, sans-serif";
  g.fillStyle=document.body.classList.contains("night")?"rgba(255,255,255,.6)":"rgba(63,49,40,.62)";
  g.fillText(names+" · day "+(state.streak||1)+" · "+new Date().toLocaleDateString("en-AU"),14,H+42);
  const url=out.toDataURL("image/png");
  document.getElementById("photoImg").src=url;
  document.getElementById("photoOut").classList.add("open");
  document.getElementById("photoSave").onclick=()=>{
    const a=document.createElement("a");
    a.href=url; a.download="kitten-cafe-"+Date.now()+".png"; a.click();
  };
  confettiRain(45);
}

  document.getElementById("dbAdd").addEventListener("click",()=>openSheet("storage"));
  document.getElementById("dbGrid").addEventListener("click",e=>{
    Deco.snap=!Deco.snap; e.currentTarget.textContent="Grid: "+(Deco.snap?"on":"off"); Audio.sfx("click");
  });
  document.getElementById("dbStore").addEventListener("click",()=>{
    if(Deco.dragging) Deco.store(Deco.dragging);
  });
  document.getElementById("photoClose").addEventListener("click",()=>
    document.getElementById("photoOut").classList.remove("open"));
  addEventListener("resize",()=>{ View.measure(); renderAll(); });
  addEventListener("visibilitychange",()=>{
    if(document.hidden){ state.lastSeen=now(); saveGame(); }
    else { applyOfflineDecay(); state.lastSeen=now(); applyTheme(); renderAll(); }
  });
  addEventListener("keydown",e=>{
    if(e.key==="Escape"){ if(document.getElementById("mg").classList.contains("open")) MG.close();
      else if(currentSheet) closeSheet(); else if(Deco.on) Deco.toggle(false); }
    if(e.key==="ArrowLeft") View.camTarget=clamp(View.camTarget-90,0,View.maxCam());
    if(e.key==="ArrowRight") View.camTarget=clamp(View.camTarget+90,0,View.maxCam());
  });
  // one-time gesture unlock for WebAudio
  const unlock=()=>{ Audio.ensure(); Audio.resume();
    if(state.settings.music) Audio.startMusic();
    removeEventListener("pointerdown",unlock); };
  addEventListener("pointerdown",unlock);
}

/* migrate a v3/v4 save into the new shape rather than wiping it */
function migrate(s){
  if(!s||!s.cats) return null;
  s.version=5;
  s.owned=s.owned||{}; s.wish=s.wish||{}; s.ach=s.ach||{}; s.seen=s.seen||{};
  s.stats=Object.assign({fed:0,cleaned:0,pets:0,games:0,placed:0,bred:0,rubs:0},s.stats||{});
  s.settings=Object.assign({music:true,sfx:true,musicVol:0.34,sfxVol:0.7,dayNight:true,particles:true,awayMode:true,realMusic:true},s.settings||{});
  for(const c of s.cats) c.away=!!c.away;
  s.streak=s.streak||0; s.coinCapBonus=s.coinCapBonus||0; s.toys=s.toys||[];
  for(const r of s.rooms){
    r.placed=r.placed||[]; r.theme=r.theme||"cottage";
    r.wp=r.wp||"w_cream"; r.fl=r.fl||"f_oak";
    r.litterClean=r.litterClean||{}; r.feeders=r.feeders||{};
    if(r.couch===undefined) r.couch=100;
    r.poops=(r.poops||[]).map(p=>({id:p.id||uid("p"),x:p.x!==undefined?p.x:rnd(0.2,0.8),y:p.y>0.6?p.y:rnd(0.72,0.92)}));
    // old saves kept litter boxes and feeders as separate arrays — turn them into real furniture
    (r.litters||[]).forEach(b=>{
      const p={u:uid("p"),item:"i_litterBox_drift",x:clamp(b.x||rnd(0.1,0.9),0.05,0.95),y:rnd(0.74,0.9),flip:1};
      r.placed.push(p); r.litterClean[p.u]=b.clean===undefined?100:b.clean;
      s.owned["i_litterBox_drift"]=1;
    });
    if(r.feeder&&r.feeder.level){
      const p={u:uid("p"),item:"i_autoFeeder_oat",x:rnd(0.15,0.85),y:rnd(0.74,0.9),flip:1};
      r.placed.push(p); r.feeders[p.u]={level:r.feeder.level,feeds:r.feeder.feeds||0};
      s.owned["i_autoFeeder_oat"]=1;
    }
    delete r.litters;
  }
  for(const c of s.cats){
    if(c.bond===undefined) c.bond=8;
    c.tricks=c.tricks||[]; c.wear=c.wear||{}; c.friends=c.friends||{};
    c.lastGameAt=c.lastGameAt||{};
    c.favGame=(MINIGAMES.some(g=>g.id===c.favGame)?c.favGame:pick(MINIGAMES).id);
    c.rubAt=now()+rnd(RUB_MIN_GAP,RUB_MAX_GAP); c.rubUntil=0;
    c.y=clamp(c.y||0.85,CAT_BAND[0],CAT_BAND[1]);
    c.ty=c.y; c.tx=c.x=clamp(c.x||0.5,0.05,0.95);
    c._sig=null;
  }
  return s;
}

async function init(){
  const loaded=await loadGame();
  state=loaded?migrate(loaded):null;
  if(!state) state=freshState();
  ensureQuests();
  applyOfflineDecay();
  state.lastSeen=now();

  View.init();
  await Particles.init();
  Atlas.build();
  View.room.uploadAtlas(Atlas.canvas);
  View.fx.uploadAtlas(Atlas.canvas);

  Audio.musicOn=state.settings.music; Audio.sfxOn=state.settings.sfx;
  Audio.musicVol=state.settings.musicVol; Audio.sfxVol=state.settings.sfxVol;
  Audio.realOn=state.settings.realMusic;

  bindUI(); bindStage(); bindMinigame();
  applyTheme();
  syncSprites();
  renderAll();

  requestAnimationFrame(t=>{ lastFrame=t; requestAnimationFrame(frame); });
  setInterval(tick,TICK_MS);
  setInterval(()=>{ applyTheme(); },60000);
  setInterval(()=>{ state.lastSeen=now(); saveGame(); },20000);

  const dot=document.getElementById("menuDot");
  setInterval(()=>{ dot.style.display=readyQuests()?"grid":"none"; },3000);

  setTimeout(()=>pushMsg("G'day! Tap a cat to give them a pat 🐾",false),700);
}
/* If startup throws, don't leave the player staring at an empty stage —
   show what broke so it can actually be diagnosed and fixed. */
function showFatalError(err){
  try{
    const box=document.getElementById("fatalError"), msg=document.getElementById("fatalErrorMsg");
    if(!box||!msg) return;
    msg.textContent=(err&&(err.stack||err.message))||String(err);
    box.style.display="flex";
  }catch(_){}
}
addEventListener("error",e=>{ if(!state) showFatalError(e.error||e.message); });
addEventListener("unhandledrejection",e=>{ if(!state) showFatalError(e.reason); });
init().catch(showFatalError);


</script>
