function migrate(s){
  // bring older single-room saves forward
  if(!s.rooms){const room=newRoom("starter");room.couch=s.couch!==undefined?s.couch:100;room.litters=[{id:uid("lit"),clean:s.litter!==undefined?s.litter:100}];room.poops=s.poops||[];room.comfort=s.comfort||[];room.furni={};s.rooms=[room];s.activeRoom=room.id;(s.cats||[]).forEach(c=>c.roomId=room.id);}
  s.rooms.forEach(room=>{
    if(!room.litters){room.litters=[{id:uid("lit"),clean:(room.litter!==undefined?room.litter:100)}];}
    room.litters.forEach(b=>{if(!b.id)b.id=uid("lit");if(b.clean===undefined)b.clean=100;});
    if(!room.furni)room.furni={};
    if(room.couch===undefined)room.couch=100;
    if(!room.poops)room.poops=[];
    if(!room.comfort)room.comfort=[];
    if(room.feeder===undefined)room.feeder=null;
    delete room.litter;
  });
  s.toys=s.toys||[];if(s.breeding===undefined)s.breeding=null;
  if(s.earnWindowStart===undefined)s.earnWindowStart=Date.now();
  if(s.earnedThisHour===undefined)s.earnedThisHour=0;
  s.cats=(s.cats||[]).filter(Boolean);
  s.cats.forEach(c=>{["tummy","mood","energy","hygiene"].forEach(k=>{if(c[k]===undefined)c[k]=70;});
    if(c.sleeping===undefined)c.sleeping=false;if(c.sick===undefined)c.sick=false;if(c.neglect===undefined)c.neglect=0;if(c.danger===undefined)c.danger=0;
    if(c.loveUntil===undefined)c.loveUntil=0;if(!c.fav)c.fav="chin";if(!c.sex)c.sex=Math.random()<0.5?"female":"male";
    if(c.x===undefined)c.x=0.3+Math.random()*0.4;if(c.y===undefined)c.y=0.4;if(c.tx===undefined)c.tx=c.x;if(c.ty===undefined)c.ty=c.y;
    if(c.face===undefined)c.face=1;if(!c.behavior)c.behavior="wander";if(c.behaviorUntil===undefined)c.behaviorUntil=0;if(c.hop===undefined)c.hop=0;
    if(c.lastPottyAt===undefined)c.lastPottyAt=Date.now()-Math.random()*POTTY_INTERVAL;
    if(c.lastPlayAt===undefined)c.lastPlayAt=0;
    if(!c.trait||!TRAITS[c.trait])c.trait=pick(TRAIT_KEYS);
    if(c.closeDoor===undefined)c.closeDoor=false;
    if(!c.roomId)c.roomId=s.activeRoom;
    if(!c.homeRoom)c.homeRoom=c.roomId;});
  state=s;
  if(!s.shelter||!s.shelter.length)generateShelter();
  if(!s.cats.length){const nc=newCat("cream",{name:"Mochi",roomId:s.activeRoom});s.cats=[nc];}
  if(!s.cats.find(c=>c.id===s.selected))s.selected=s.cats[0].id;
  return s;
}
/* Apply decay for real time elapsed while the game was closed, and award
   offline coins (1/hour per cat whose every stat except growth is above 80).
   Tuned slow so a full bar lasts most of a day. */
function applyOfflineDecay(){
  if(!state||!state.lastSeen)return;
  const elapsedSec=Math.max(0,(Date.now()-state.lastSeen)/1000);
  if(elapsedSec<30)return;                 // ignore quick reloads
  const cap=60*60*48;                      // never decay more than ~48h worth in one jump
  const sec=Math.min(elapsedSec,cap);
  const hoursAway=elapsedSec/3600;
  // per-second rates = per-tick rate / 3.5s tick (matches the live tick exactly)
  const tummyR=DECAY.tummy/3.5, energyR=DECAY.energy/3.5, moodR=DECAY.mood/3.5, hygR=DECAY.hygiene/3.5;
  let offlineCoins=0;
  state.cats.forEach(c=>{
    // a content cat (all non-growth stats >80) earns 1 coin/hour while you're away
    const happy=c.tummy>80&&c.energy>80&&c.mood>80&&c.hygiene>80&&!c.sick;
    if(happy)offlineCoins+=Math.floor(hoursAway);
    // helpful cats chip in extra coins while you're away (even if not perfectly happy)
    if(traitOf(c)==="helpful"&&!c.sick&&c.mood>40)offlineCoins+=Math.floor(hoursAway);
    if(c.sleeping){
      c.energy=clamp(c.energy + sec*(DECAY.tummySleep*2/3.5)*10); // recovers while away
      c.tummy=clamp(c.tummy - sec*tummyR*0.5);
    } else {
      c.tummy=clamp(c.tummy - sec*tummyR);
      c.energy=clamp(c.energy - sec*energyR);
      c.mood=clamp(c.mood - sec*moodR);
      c.hygiene=clamp(c.hygiene - sec*hygR);
    }
    c._sig=null;
  });
  if(offlineCoins>0){state.pts+=offlineCoins;setTimeout(()=>pushMsg(`Your happy cats earned ${offlineCoins} 🪙 while you were away!`,false),1300);}
  const hrs=Math.floor(elapsedSec/3600);
  if(hrs>=1)setTimeout(()=>pushMsg(`Welcome back! Your cats waited ${hrs}h — check on them 🐾`,false),900);
}
async function init(){
  bindGlobal();
  const loaded=await loadGame();
  state=loaded?migrate(loaded):freshState();
  applyOfflineDecay();
  renderAll();
  requestAnimationFrame(frame);
  setInterval(tick,3500);
  if(state.firstRun){state.firstRun=false;saveGame();setTimeout(()=>pushMsg("Tap a cat to select & pet it 💗",false),700);}
}
init();
</script>
