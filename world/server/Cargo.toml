[package]
name = "petopia-world"
version = "1.0.0"
edition = "2021"
description = "Petopia World server: published homes, 6-letter codes and the leaderboard"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
